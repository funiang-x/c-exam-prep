<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>C语言备考系统·手机版</title>
<style>
/* C语言备考学习系统 样式 */
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f4f6fa;
  --card: #ffffff;
  --ink: #1f2937;
  --muted: #6b7280;
  --line: #e5e7eb;
  --brand: #2563eb;
  --brand-soft: #dbeafe;
  --ok: #16a34a;
  --ok-soft: #dcfce7;
  --bad: #dc2626;
  --bad-soft: #fee2e2;
  --warn: #d97706;
  --warn-soft: #fef3c7;
}
body {
  font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.65;
  padding-bottom: 60px;
}
/* ===== 顶栏 ===== */
header {
  position: sticky; top: 0; z-index: 10;
  background: #fff; border-bottom: 1px solid var(--line);
  padding: 10px 16px;
}
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-size: 20px; }
.countdown {
  background: var(--bad); color: #fff; border-radius: 999px;
  padding: 1px 12px; font-size: 13px; font-weight: bold;
}
.streak { color: var(--warn); font-size: 13px; font-weight: bold; }
nav { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
nav button {
  border: 1px solid var(--line); background: #fff; color: var(--ink);
  padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 14px;
  font-family: inherit;
}
nav button.active { background: var(--brand); color: #fff; border-color: var(--brand); }
nav .badge {
  background: var(--bad); color: #fff; border-radius: 999px;
  font-size: 11px; padding: 0 6px; margin-left: 2px;
}
main { max-width: 900px; margin: 16px auto; padding: 0 12px; }
/* ===== 通用组件 ===== */
.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; padding: 16px 18px; margin-bottom: 14px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}
.card h2 { font-size: 17px; margin-bottom: 10px; }
.card h3 { font-size: 15px; margin: 12px 0 6px; }
.btn {
  display: inline-block; border: 1px solid var(--line); background: #fff;
  color: var(--ink); padding: 8px 16px; border-radius: 8px; cursor: pointer;
  font-size: 14px; font-family: inherit; text-decoration: none;
}
.btn:hover { border-color: var(--brand); color: var(--brand); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { opacity: .9; color: #fff; }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.pill {
  display: inline-block; background: var(--brand-soft); color: var(--brand);
  border-radius: 999px; font-size: 12px; padding: 1px 10px; margin-right: 6px;
}
.pill.gray { background: #eceff3; color: var(--muted); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.bar { background: #eceff3; border-radius: 999px; height: 10px; overflow: hidden; }
.bar > div { background: var(--ok); height: 100%; border-radius: 999px; transition: width .3s; }
.muted { color: var(--muted); font-size: 13px; }
.hidden { display: none !important; }
/* 今日任务 */
.task { display: flex; align-items: flex-start; gap: 10px; padding: 9px 4px; border-bottom: 1px dashed var(--line); }
.task:last-child { border-bottom: none; }
.task input[type=checkbox] { width: 19px; height: 19px; margin-top: 3px; cursor: pointer; accent-color: var(--ok); flex: none; }
.task label { cursor: pointer; }
.task.done label { text-decoration: line-through; color: var(--muted); }
.phase-banner { border-left: 4px solid var(--brand); padding-left: 10px; margin-bottom: 8px; }
.loop-steps { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.loop-steps span { background: var(--brand-soft); color: var(--brand); border-radius: 8px; padding: 4px 10px; font-size: 13px; font-weight: bold; }
/* 章节卡片 */
.ch-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ch-head .grow { flex: 1; }
.ch-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
details.notes { margin-top: 10px; }
details.notes summary { cursor: pointer; color: var(--brand); font-weight: bold; }
details.notes[open] summary { margin-bottom: 8px; }
.notes-body { border-top: 1px dashed var(--line); padding-top: 8px; font-size: 14px; }
.notes-body h3 { margin-top: 14px; }
.notes-body pre { background: #f6f8fa; border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; font-size: 13px; margin: 6px 0; }
.notes-body code { background: #f6f8fa; padding: 0 4px; border-radius: 4px; }
.notes-body ul { padding-left: 22px; margin: 6px 0; }
.notes-body table { border-collapse: collapse; margin: 6px 0; font-size: 13px; }
.notes-body th, .notes-body td { border: 1px solid var(--line); padding: 4px 8px; }
.notes-body th { background: #f6f8fa; }
/* 刷题 */
.qtop { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.qtext { white-space: pre-wrap; font-size: 15px; margin-bottom: 12px; }
.qtext code, .opt code { font-family: Consolas, "Courier New", monospace; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  text-align: left; border: 1.5px solid var(--line); background: #fff;
  border-radius: 10px; padding: 11px 14px; cursor: pointer; font-size: 14.5px;
  font-family: inherit; white-space: pre-wrap; line-height: 1.55;
}
.opt:hover { border-color: var(--brand); background: var(--brand-soft); }
.opt.locked { pointer-events: none; }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.expbox { margin-top: 12px; border-radius: 10px; padding: 10px 14px; font-size: 14px; }
.expbox.good { background: var(--ok-soft); border: 1px solid var(--ok); }
.expbox.bad2 { background: var(--bad-soft); border: 1px solid var(--bad); }
.codebox { background: #0f172a; color: #e2e8f0; border-radius: 10px; padding: 12px 14px; overflow-x: auto; font-family: Consolas, "Courier New", monospace; font-size: 13.5px; white-space: pre; margin-top: 8px; }
.qnav { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
/* 模拟考 */
.timer {
  font-size: 22px; font-weight: bold; font-family: Consolas, monospace;
  color: var(--brand); background: var(--brand-soft);
  border-radius: 8px; padding: 2px 14px; display: inline-block;
}
.timer.low { color: var(--bad); background: var(--bad-soft); }
.qgrid { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.qgrid button {
  width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
  background: #fff; cursor: pointer; font-size: 13px; font-family: inherit;
}
.qgrid button.cur { border-color: var(--brand); color: var(--brand); font-weight: bold; }
.qgrid button.done { background: var(--brand-soft); border-color: var(--brand-soft); }
.selfgrade { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.selfgrade label {
  border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 14px;
  cursor: pointer; display: flex; gap: 10px; align-items: center; font-size: 14.5px;
}
.selfgrade label:hover { border-color: var(--brand); }
.selfgrade input { accent-color: var(--brand); width: 17px; height: 17px; }
/* 统计表格 */
table.stats { border-collapse: collapse; width: 100%; font-size: 14px; }
table.stats th, table.stats td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; }
table.stats th { background: #f6f8fa; font-size: 13px; }
table.stats tr:hover td { background: #fafbfc; }
.rate-good { color: var(--ok); font-weight: bold; }
.rate-mid { color: var(--warn); font-weight: bold; }
.rate-bad { color: var(--bad); font-weight: bold; }
/* 帮助 */
.stepflow { display: flex; flex-direction: column; gap: 10px; }
.stepflow .s { display: flex; gap: 12px; align-items: flex-start; }
.stepflow .num {
  flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--brand);
  color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold;
}
.big-emoji { font-size: 40px; text-align: center; margin: 6px 0; }
.center { text-align: center; }
@media (max-width: 600px) {
  main { padding: 0 8px; }
  .card { padding: 12px; }
  .brand h1 { font-size: 16px; }
}
/* ===== v2 工作台 ===== */
.hero { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.hero .card { flex: 1; min-width: 200px; margin-bottom: 0; text-align: center; padding: 12px; }
.hero .num { font-size: 26px; font-weight: bold; color: var(--brand); }
.hero .lbl { font-size: 13px; color: var(--muted); }
.advice-item { display: flex; gap: 10px; padding: 8px 2px; border-bottom: 1px dashed var(--line); align-items: flex-start; }
.advice-item:last-child { border-bottom: none; }
.advice-item .ico { flex: none; font-size: 18px; }
.weak-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.weak-chips button { border: 1px solid var(--bad-soft); background: var(--bad-soft); color: var(--bad); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; font-family: inherit; }
.weak-chips button:hover { opacity: .8; }
.heat-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
.heat-row .tname { width: 110px; flex: none; font-size: 13.5px; }
.heat-row .tbar { flex: 1; }
.heat-row .trate { width: 52px; text-align: right; font-size: 13px; }
.logbars { display: flex; align-items: flex-end; gap: 4px; height: 70px; padding-top: 6px; }
.logbars .lb { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; height: 100%; }
.logbars .bar2 { width: 70%; max-width: 26px; background: var(--brand); border-radius: 4px 4px 0 0; min-height: 2px; }
.logbars .lb.zero .bar2 { background: #e5e7eb; }
.logbars .cap { font-size: 10px; color: var(--muted); writing-mode: vertical-lr; height: 34px; overflow: hidden; }
.trendbox svg { max-width: 100%; }
.modal-mask { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: #fff; border-radius: 12px; max-width: 640px; width: 100%; max-height: 84vh; overflow: auto; padding: 18px; }
.modal h3 { margin-bottom: 8px; }
.modal textarea { width: 100%; height: 200px; font-size: 12px; font-family: Consolas, monospace; border: 1px solid var(--line); border-radius: 8px; padding: 8px; box-sizing: border-box; }
.modal .mrow { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.srs-lv { font-size: 11px; background: #eceff3; color: var(--muted); border-radius: 999px; padding: 1px 8px; }
.due-tip { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 6px 10px; font-size: 13px; margin-bottom: 10px; }
/* ===== v3 豪华版 ===== */
body {
  background:
    radial-gradient(1100px 520px at 8% -8%, #dbeafe 0%, transparent 55%),
    radial-gradient(900px 480px at 108% -4%, #ede9fe 0%, transparent 55%),
    linear-gradient(180deg, #f7f9fd 0%, #eef2f9 100%);
  background-attachment: fixed;
  min-height: 100vh;
}
header {
  background: linear-gradient(130deg, #1e3a8a 0%, #2563eb 48%, #7c3aed 100%);
  border: none;
  box-shadow: 0 6px 28px rgba(37, 99, 235, .28);
  padding: 14px 18px 12px;
}
.brand h1 {
  color: #fff; letter-spacing: .5px;
  text-shadow: 0 2px 10px rgba(0,0,0,.25);
}
.countdown {
  background: linear-gradient(135deg, #f59e0b, #ef4444);
  box-shadow: 0 2px 12px rgba(239, 68, 68, .45);
  font-size: 14px; padding: 2px 14px;
}
.streak { color: #fde68a; text-shadow: 0 1px 4px rgba(0,0,0,.2); }
nav button {
  background: rgba(255,255,255,.14);
  color: #e0e7ff;
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 999px;
  backdrop-filter: blur(8px);
  transition: all .18s ease;
}
nav button:hover { background: rgba(255,255,255,.24); color: #fff; }
nav button.active {
  background: #fff; color: #1d4ed8; font-weight: bold;
  box-shadow: 0 3px 14px rgba(0,0,0,.18);
}
nav .badge { box-shadow: 0 1px 6px rgba(0,0,0,.35); }
.card {
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,.75);
  box-shadow: 0 2px 6px rgba(15,23,42,.05), 0 14px 34px -14px rgba(15,23,42,.14);
  transition: transform .16s ease, box-shadow .16s ease;
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 14px rgba(15,23,42,.07), 0 22px 44px -16px rgba(15,23,42,.20);
}
.card h2 { position: relative; padding-left: 13px; }
.card h2::before {
  content: ''; position: absolute; left: 0; top: 5px; bottom: 5px;
  width: 4px; border-radius: 2px;
  background: linear-gradient(180deg, #2563eb, #7c3aed);
}
.btn { border-radius: 11px; transition: all .16s ease; }
.btn.primary {
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  border: none; color: #fff;
  box-shadow: 0 3px 14px rgba(37, 99, 235, .35);
}
.btn.primary:hover {
  transform: translateY(-1px); opacity: 1; color: #fff;
  box-shadow: 0 7px 20px rgba(37, 99, 235, .45);
}
.btn:not(.primary):hover { transform: translateY(-1px); }
.opt {
  border-radius: 13px;
  padding: 11px 14px 11px 54px;
  position: relative;
  transition: all .15s ease, transform .15s ease;
}
.opt .letter {
  position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
  width: 27px; height: 27px; border-radius: 50%;
  background: #eef2f7; color: #64748b;
  display: flex; align-items: center; justify-content: center;
  font-weight: bold; font-size: 13px;
  transition: all .15s ease;
}
.opt:hover { transform: translateX(3px); }
.opt.correct { background: linear-gradient(135deg, #dcfce7, #d1fae5); animation: pop .3s ease; }
.opt.correct .letter { background: linear-gradient(135deg, #16a34a, #15803d); color: #fff; }
.opt.wrong { background: linear-gradient(135deg, #fee2e2, #fecaca); animation: shake .3s ease; }
.opt.wrong .letter { background: linear-gradient(135deg, #dc2626, #b91c1c); color: #fff; }
@keyframes pop { 0% { transform: scale(.98); } 55% { transform: scale(1.015); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 30% { transform: translateX(-4px); } 60% { transform: translateX(4px); } }
main > .card, main > div { animation: fadeUp .28s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.quote {
  font-size: 14px; color: #713f12; font-style: italic;
  background: linear-gradient(90deg, #fef9c3, #fef3c7 70%, transparent);
  border-left: 4px solid #f59e0b;
  padding: 9px 14px; border-radius: 0 10px 10px 0;
  margin-bottom: 14px;
}
.focus-clock {
  font-size: 46px; font-weight: 800; font-family: Consolas, monospace;
  letter-spacing: 3px; text-align: center;
  background: linear-gradient(135deg, #1e3a8a, #7c3aed);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  padding: 6px 0 2px;
}
.focus-state { text-align: center; color: var(--muted); font-size: 13px; min-height: 20px; }
.confetti-piece {
  position: fixed; top: -24px; z-index: 99;
  width: 10px; height: 15px; border-radius: 2px;
  animation: fall linear forwards;
  pointer-events: none;
}
@keyframes fall { to { transform: translateY(106vh) rotate(720deg); opacity: .85; } }
.flash { border: 1px solid var(--line); border-radius: 14px; padding: 13px 16px; margin-bottom: 10px; background: rgba(255,255,255,.92); }
.flash summary { cursor: pointer; font-weight: bold; font-size: 15px; }
.flash summary .ftag { font-size: 12px; color: var(--brand); background: var(--brand-soft); border-radius: 999px; padding: 1px 10px; margin-right: 8px; }
.flash .fbody { margin-top: 9px; border-top: 1px dashed var(--line); padding-top: 9px; font-size: 14px; }
.flash .fbody pre { background: #f6f8fa; padding: 9px 12px; border-radius: 9px; overflow-x: auto; font-size: 13px; margin: 6px 0; }
.flash .fbody ul { padding-left: 20px; }
.flash .fbody table { border-collapse: collapse; font-size: 13px; margin: 6px 0; }
.flash .fbody th, .flash .fbody td { border: 1px solid var(--line); padding: 4px 9px; }
.flash .fbody th { background: #f6f8fa; }
#cheatSearch {
  width: 100%; padding: 11px 18px;
  border: 2px solid var(--line); border-radius: 999px;
  font-size: 15px; margin-bottom: 14px; box-sizing: border-box;
  font-family: inherit; background: rgba(255,255,255,.9);
  transition: border .15s ease, box-shadow .15s ease;
}
#cheatSearch:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #c7d2e8; border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: #94a8cc; background-clip: content-box; }
.expbox { border-radius: 12px; }
.timer { border-radius: 999px; }
/* ===== DIY 工作台 ===== */
.widget { position: relative; }
.widget.editing { outline: 2px dashed #a5b4fc; outline-offset: 3px; cursor: grab; }
.widget.dragging { opacity: .45; }
.wctrl { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; z-index: 5; }
.wbtn {
  width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line);
  background: #fff; color: var(--muted); cursor: pointer; font-size: 13px; line-height: 1;
}
.wbtn:hover { border-color: var(--brand); color: var(--brand); }
.wbtn.danger:hover { border-color: var(--bad); color: var(--bad); }
.bigcount {
  font-size: 46px; font-weight: 800; text-align: center; padding: 8px 0 2px;
  font-family: Consolas, "Segoe UI", monospace;
  background: linear-gradient(135deg, #1e3a8a, #7c3aed);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.notebox {
  width: 100%; min-height: 110px; resize: vertical;
  border: 1.5px solid var(--line); border-radius: 10px;
  padding: 10px 12px; font-size: 14px; font-family: inherit;
  box-sizing: border-box; background: #fffceb; line-height: 1.6;
}
.notebox:focus { outline: none; border-color: #f59e0b; }
.minirow { display: flex; align-items: center; gap: 10px; padding: 5px 0; cursor: pointer; }
.minirow .mname { width: 118px; flex: none; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.minirow .tbar { flex: 1; }
.minirow .trate { width: 46px; text-align: right; font-size: 12.5px; color: var(--muted); }
.minirow:hover .mname { color: var(--brand); }
.cheatin {
  width: 100%; padding: 9px 12px; margin-top: 8px;
  border: 1.5px solid var(--line); border-radius: 10px;
  font-size: 14px; font-family: inherit; box-sizing: border-box; background: #fff;
}
.cheatin:focus { outline: none; border-color: var(--brand); }
.linkrow { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.linkrow a { color: var(--brand); text-decoration: none; flex: 1; font-size: 14px; }
.linkrow a:hover { text-decoration: underline; }
.doodle { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; touch-action: none; cursor: crosshair; }
.weekrow { display: flex; gap: 10px; padding: 6px 4px; border-bottom: 1px dashed var(--line); font-size: 13.5px; align-items: baseline; }
.weekrow:last-child { border-bottom: none; }
.weekrow.today { background: var(--brand-soft); border-radius: 8px; padding-left: 8px; }
.weekrow.today b { color: var(--brand); }
.weekrow.weekend span { color: var(--muted); }
.weekrow b { flex: none; width: 92px; }
.badgegrid { display: flex; flex-wrap: wrap; gap: 10px; }
.badge { width: 72px; text-align: center; opacity: .3; filter: grayscale(1); }
.badge.on { opacity: 1; filter: none; }
.badge .bico { font-size: 30px; }
.badge .bname { font-size: 11.5px; color: var(--muted); }
.badge.on .bname { color: var(--ink); font-weight: bold; }


/* ===== 手机版补充样式 ===== */
body { -webkit-tap-highlight-color: transparent; }
nav { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
nav button { flex: none; }
.opt { padding-left: 48px; font-size: 14px; }
.qtext { font-size: 14.5px; }
.bigcount { font-size: 38px; }
.focus-clock { font-size: 38px; }
.brand h1 { font-size: 15px; }
.countdown { font-size: 12px; }
main { margin-top: 10px; }

</style>
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<header>
  <div class="brand">
    <h1>🔥 C语言备考学习系统</h1>
    <span class="countdown" id="countdown">…</span>

  { id: 'ch3-8', ch: 3, type: 'single', q: '转义字符\'\\101\'代表的字符是（　）。', opts: ['A', 'a', 'e', '\\0'], ans: 0, exp: '\\101 表示八进制 ASCII 码 101，即十进制 65，正好是大写字母 A；不要与 \\0 混淆。' },
  { id: 'ch3-9', ch: 3, type: 'single', q: '在VC++环境下，sizeof(int)、sizeof(char)、sizeof(double) 的值依次是（　）。', opts: ['2、1、8', '4、2、8', '4、1、8', '4、1、4'], ans: 2, exp: 'VC++/GCC 下 int 占 4 字节、char 占 1 字节、double 占 8 字节，这组数字要记牢；int 占 2 字节是旧 Turbo C 的说法。' },
  { id: 'ch3-10', ch: 3, type: 'single', q: '表达式 sizeof(3.14) 的值是（　）。', opts: ['4', '2', '8', '16'], ans: 2, exp: '3.14 是实型常量，系统默认按 double 类型存储，占 8 字节；只有加 f 后缀（如 3.14f）才是 float 型。' },
  { id: 'ch3-11', ch: 3, type: 'single', q: 'unsigned char 类型变量的取值范围是（　）。', opts: ['0~127', '-128~127', '1~256', '0~255'], ans: 3, exp: 'unsigned char 是无符号型，1 字节 8 位全部用来表示数值，范围 0~255；带符号的 char 才是 -128~127。' },
  { id: 'ch3-12', ch: 3, type: 'single', q: '已知字符\'A\'的 ASCII 码值为 65，有以下程序段：\nchar c = \'A\' + 32;\nprintf("%c", c);\n运行后输出的结果是（　）。', opts: ['97', '65', 'a', 'A'], ans: 2, exp: '\'A\'+32 即 65+32=97，正是小写字母 a 的 ASCII 码；%c 按字符输出 a。这就是大小写字母互相转换的原理，若用 %d 输出则是 97。' },
  { id: 'ch3-13', ch: 3, type: 'single', q: '表达式 5 / 2 + 5 % 2 的值是（　）。', opts: ['3.5', '2', '2.5', '3'], ans: 3, exp: '两个整数相除只取整数部分：5/2=2；5%2 取余得 1；所以结果是 2+1=3。易错点是把 5/2 当成 2.5。' },
  { id: 'ch3-14', ch: 3, type: 'single', q: '表达式 -5 / 2 和 5.0 / 2 的值依次是（　）。', opts: ['-2.5、2.5', '-2、2', '-2、2.5', '-2.5、2'], ans: 2, exp: '两个整数相除向零取整，-5/2=-2 而不是 -2.5；只要有一个操作数是实数（5.0/2）就按实数除法，得 2.5。' },
  { id: 'ch3-15', ch: 3, type: 'single', q: '下列表达式中，不合法（编译报错）的是（　）。', opts: ['5%2', '5%(-2)', '-5%2', '5.0%2'], ans: 3, exp: '求余运算符 % 要求两侧的操作数都必须是整型，5.0%2 不合法；其余三个都是整数取余，完全合法。' },
  { id: 'ch3-16', ch: 3, type: 'single', q: '表达式 (double)(3 / 2) 的值是（　）。', opts: ['1.5', '1.0', '1', '2'], ans: 1, exp: '括号优先：先算 3/2，两个整数相除得 1，小数已经丢掉，再转成 double 得 1.0。强制转换救不回已丢失的小数。' },
  { id: 'ch3-17', ch: 3, type: 'single', q: '设有定义 double x = 3.5; int y = 2; 则表达式 x / y 的值是（　）。', opts: ['1', '1.75', '2', '1.5'], ans: 1, exp: '混合运算时类型向高转：y 先提升为 double 型 2.0 再相除，3.5/2.0=1.75；若 x 也是 int，结果才会是 1。' },
  { id: 'ch3-18', ch: 3, type: 'single', q: '设有定义 int a; 执行语句 a = 7.9; 后，变量 a 的值是（　）。', opts: ['7.9', '8', '0', '7'], ans: 3, exp: '赋值时右侧转换成左侧类型：7.9 赋给 int 变量直接截断小数得 7，不是四舍五入，也不会得到 8。' },
  { id: 'ch3-19', ch: 3, type: 'single', q: '设有定义 float x = 2.5, y = 4.7; 则表达式 (int)(x + y) 和 (int)x + (int)y 的值依次是（　）。', opts: ['7、6', '6、7', '7、7', '6、6'], ans: 0, exp: '(int)(x+y) 先求和 7.2 再取整得 7；(int)x+(int)y 是各自先取整再相加 2+4=6。括号位置不同，结果不同。' },
  { id: 'ch3-20', ch: 3, type: 'single', q: '设有定义 int x, a; 执行语句 x = (a = 3) * 2; 后，x 和 a 的值分别是（　）。', opts: ['x=6、a=3', 'x=5、a=3', 'x=6、a=6', 'x=3、a=3'], ans: 0, exp: '赋值表达式 a=3 本身有值、值就是 3，乘 2 得 6，同时 a 被赋为 3。这是"赋值表达式有值"的典型用法。' },
  { id: 'ch3-21', ch: 3, type: 'single', q: '设有定义 int a, b; 执行语句 a = b = 5; 后，a 和 b 的值分别是（　）。', opts: ['a=5、b=5', 'a=5、b的值不确定', 'a=0、b=5', '语法错误，不允许连续赋值'], ans: 0, exp: '赋值运算符从右向左结合，a=b=5 等价于 a=(b=5)：赋值表达式 b=5 的值是 5，再赋给 a，所以 a、b 都是 5。' },
  { id: 'ch3-22', ch: 3, type: 'single', q: '设有定义 int a = 5, b = 3; 执行语句 a *= b + 3; 后，a 的值是（　）。', opts: ['30', '18', '24', '15'], ans: 0, exp: '复合赋值号右边是一个整体：a*=b+3 等价于 a=a*(b+3)=5*6=30，而不是 a=a*b+3=18。' },
  { id: 'ch3-23', ch: 3, type: 'single', q: '设有定义 int x, a; 执行语句 x = (a = 3, a + 1, a + 2); 后，x 和 a 的值分别是（　）。', opts: ['x=6、a=3', 'x=5、a=3', 'x=6、a=5', 'x=5、a=5'], ans: 1, exp: '逗号表达式取最后一个表达式的值：a+2=5 赋给 x；a+1、a+2 都没有改变 a，所以 a 仍是 3。' },
  { id: 'ch3-24', ch: 3, type: 'single', q: '设有定义 int a = 5; 表达式 !a + 2 的值是（　）。', opts: ['0', '1', '2', '3'], ans: 2, exp: '逻辑非 ! 的优先级高于算术运算符：先算 !a，a 非 0 得 0，再算 0+2=2。注意不是先算 a+2。' },
  { id: 'ch3-25', ch: 3, type: 'single', q: '设有定义 int a = 3, b = 4; 表达式 a + 1 > b 的值是（　）。', opts: ['1', '4', '0', '3'], ans: 2, exp: '算术运算优先于关系运算：先算 a+1=4，再判断 4>4 不成立，关系表达式的值为 0（假）；若成立则为 1。' },
  { id: 'ch3-26', ch: 3, type: 'judge', q: 'C语言严格区分大小写，所以 Int 和 int 是两个不同的标识符，Int 不是关键字。', opts: ['正确', '错误'], ans: 0, exp: '关键字都是小写（如 int、float、for），Int 以大写 I 开头，系统把它当作普通标识符处理，是合法的。' },
  { id: 'ch3-27', ch: 3, type: 'judge', q: '在C语言中，表达式 1 / 2 的值是 0.5。', opts: ['正确', '错误'], ans: 1, exp: '两个整数相除仍得整数，1/2=0，小数被截断丢弃；要得到 0.5 必须写成 1.0/2 或 1/2.0。' },
  { id: 'ch3-28', ch: 3, type: 'judge', q: '设有定义 double x = 3.14; 执行语句 (int)x; 后，变量 x 的值变为 3。', opts: ['正确', '错误'], ans: 1, exp: '(int)x 只是把 x 的值临时转换成 3 参与运算，x 本身的值和类型都不变，仍是 3.14；要改变 x 必须写 x = (int)x;。' },
  { id: 'ch3-29', ch: 3, type: 'blank', q: '下面程序的功能是把小写字母转换成大写字母输出，请补全程序：\n#include <stdio.h>\nint main()\n{\n    char c1 = \'a\', c2;\n    c2 = ____;      /* 将小写字母转换为大写字母 */\n    printf("%c\\n", c2);\n    return 0;\n}\n横线处应填（　）。', opts: ["c1+'A'-'a'", 'c1+32', "c1-'a'", "c1+'a'"], ans: 0, exp: '大小写字母的 ASCII 码相差 32，小写转大写应减 32；\'A\'-\'a\' 恰好等于 -32，所以 c1+\'A\'-\'a\' 正确；c1+32 得 129，已超出字母范围。' },
  { id: 'ch3-30', ch: 3, type: 'blank', q: '下面程序用于拆分三位整数 123，输出它的个位和百位数字，请补全程序：\n#include <stdio.h>\nint main()\n{\n    int n = 123, a, b;\n    a = ____;      /* 求个位数字 */\n    b = n / 100;   /* 求百位数字 */\n    printf("%d %d\\n", a, b);\n    return 0;\n}\n横线处应填（　）。', opts: ['n/10', 'n%10', 'n/100', 'n%100'], ans: 1, exp: '个位数字 = 123%10 = 3；n/10=12、n/100=1 都不是个位；百位正是 n/100=1。程序输出 3 1。' },
  { id: 'ch3-31', ch: 3, type: 'blank', q: '下面程序要求执行后 x 的值为 8，且 a 保持为 3，请补全程序：\n#include <stdio.h>\nint main()\n{\n    int a, x;\n    x = (a = 3, ____);   /* 执行后 x 的值为 8 */\n    printf("%d\\n", x);\n    return 0;\n}\n横线处应填（　）。', opts: ['a+5', 'a=5', 'a+1', 'a*5'], ans: 0, exp: '逗号表达式取最后一项的值：填 a+5 时 x=8 且 a 不变；若填 a=5，则 x=5 且 a 被改成了 5，不符合要求。' },
  { id: 'ch3-32', ch: 3, type: 'read', q: '有以下程序\n#include <stdio.h>\nint main()\n{\n    int i = 3, j = 10, k;\n    j = i++;\n    k = ++j;\n    printf("%d,%d,%d\\n", i, j, k);\n    return 0;\n}\n程序运行后的输出结果是（　）。', opts: ['3,4,4', '4,4,4', '4,3,4', '4,4,3'], ans: 1, exp: 'j=i++ 先用后加：j 得 3、i 变 4；k=++j 先加后用：j 先变 4、k 得 4。输出 4,4,4。自增拆在不同语句中，结果唯一。' },
  { id: 'ch3-33', ch: 3, type: 'read', q: '有以下程序\n#include <stdio.h>\nint main()\n{\n    int a = 5, b = 2;\n    double x;\n    x = a / b;\n    printf("%.1f\\n", x);\n    printf("%d\\n", a % b);\n    return 0;\n}\n程序运行后的输出结果是（　）。', opts: ['2.0\\n1', '2.5\\n1', '2.0\\n0', '2\\n1'], ans: 0, exp: 'a/b 是两个 int 相除，先按整除得 2，再转成 double 赋给 x 得 2.0；5%2=1。易错点：不是 2.5，整数除法在赋值之前就完成了。' },
  { id: 'ch3-34', ch: 3, type: 'read', q: '有以下程序\n#include <stdio.h>\nint main()\n{\n    char c1 = \'A\', c2;\n    c2 = c1 + 3;\n    printf("%c,%d\\n", c2, c1);\n    return 0;\n}\n程序运行后的输出结果是（　）。', opts: ['D,66', '71,65', 'D,65', '68,65'], ans: 2, exp: 'c2 = \'A\'+3 即 65+3=68，是字母 D，%c 输出 D；%d 输出 c1 的 ASCII 码 65。结果为 D,65。' },
  { id: 'ch3-35', ch: 3, type: 'code',
    q: '编写一个完整的C程序：从键盘输入一个三位整数 n，输出它的个位、十位、百位数字（要求用整数除法和求余运算实现）。',
    sample: '#include <stdio.h>\n' +
            'int main()\n' +

            '    printf("g=%d,s=%d,b=%d\\n", g, s, b);\n' +

            '}',

);

window.NOTES[4] = {

  points:
    '<h3>📌 本章考点清单</h3>' +
    '<ul>' +
    '<li><b>C 语句五大类</b>：控制语句、函数调用语句、表达式语句、空语句（;）、复合语句（{}括起）；每条简单语句以分号结尾。</li>' +
    '<li><b>printf 格式符</b>：%d、%f、%c、%s、%ld、%u、%o、%x、%e、%%；%f 默认输出 6 位小数。</li>' +
    '<li><b>宽度与精度</b>：%5d 宽度 5 右对齐；%.2f 保留 2 位小数；%5.2f 总宽 5（含小数点）；%-8.2f 左对齐。</li>' +
    '<li><b>scanf</b>：普通变量必须加 &amp; 取地址；多个 %d 之间用空格/回车/Tab 分隔；%c 不跳过空格和回车。</li>' +

    '<li><b>double 的读写</b>：scanf 用 %lf，printf 用 %f 即可。</li>' +
    '<li><b>赋值语句 vs 赋值表达式</b>：表达式有值可嵌套，语句以分号结尾不能再嵌套。</li>' +
    '</ul>' +
    '<h3>📖 核心讲解</h3>' +
    '<h4>1. C 语句五大类</h4>' +
    '<table>' +
    '<tr><th>类别</th><th>例子</th></tr>' +
    '<tr><td>控制语句</td><td>if、for、while、do-while、switch、break、continue、return 等</td></tr>' +

    '<tr><td>表达式语句</td><td>a = 3 * 5;（表达式加分号）</td></tr>' +
    '<tr><td>空语句</td><td>;（只有一个分号，什么也不做）</td></tr>' +
    '<tr><td>复合语句</td><td>{ t=a; a=b; b=t; }（{} 括起，{} 外不加分号）</td></tr>' +
    '</table>' +
    '<h4>2. printf 详解</h4>' +
    '<p>格式：printf(格式控制串, 输出列表); 普通字符原样输出，格式符被输出列表中的数据依次替换。</p>' +
    '<pre><code>printf("%5d", 42);       /* □□□42   宽度5，右对齐补空格 */\nprintf("%.2f", 3.14159); /* 3.14     保留2位小数 */\nprintf("%5.2f", 3.14159);/* □3.14    总宽5（含小数点） */\nprintf("%-8.2f", 1.5);   /* 1.50□□□□ 负号=左对齐 */\nprintf("100%%");         /* 100%     %%输出百分号本身 */</code></pre>' +
    '<p>（□表示一个空格）%m.nf：m 是总宽度，n 是小数位数，右对齐左边补空格；m 前加负号则左对齐右边补空格。</p>' +
    '<h4>3. 常用格式符速查</h4>' +
    '<table>' +
    '<tr><th>格式符</th><th>对应数据</th><th>示例</th></tr>' +
    '<tr><td>%d / %ld</td><td>int / long</td><td>printf("%d", 42); 得 42</td></tr>' +

    '<tr><td>%f / %e</td><td>小数 / 指数形式</td><td>printf("%e", 123.4); 得 1.234000e+02</td></tr>' +
    '<tr><td>%c</td><td>一个字符</td><td>printf("%c", \'A\'); 得 A</td></tr>' +
    '<tr><td>%s</td><td>字符串</td><td>printf("%s", "hi"); 得 hi</td></tr>' +
    '<tr><td>%%</td><td>百分号本身</td><td>printf("100%%"); 得 100%</td></tr>' +
    '</table>' +
    '<h4>4. scanf 详解</h4>' +
    '<pre><code>int a, b;\nscanf("%d%d", &amp;a, &amp;b);   /* 必须加 &amp; 取地址 */\n/* 输入时两个数之间用空格、回车或 Tab 分隔均可 */</code></pre>' +
    '<p>经典陷阱：scanf("%d%c", &amp;n, &amp;c); 中 %c 不跳过空格和回车——输入 12 A 时，c 读到的是空格而不是 A。</p>' +
    '<h4>5. putchar 与 getchar</h4>' +
    '<pre><code>char ch;\nch = getchar();   /* 读一个字符，回车也算一个字符 */\nputchar(ch);      /* 输出一个字符 */</code></pre>' +
    '<h4>6. double 的读写</h4>' +
    '<pre><code>double d;\nscanf("%lf", &amp;d);     /* 输入必须用 %lf，用 %f 读不进去 */\nprintf("%f", d);      /* 输出用 %f 就行，默认6位小数 */</code></pre>' +

    '<li>scanf 少写 &amp;：编译一般能通过，但数据存不进变量，是最常见的隐蔽错误。</li>' +

    '<li>语句漏写分号，编译报错却常常指向下一行。</li>' +

    '<li>a/b 整除之后再赋给 double 不会变回小数：7/2 得 3.00 而不是 3.50。</li>' +

};

window.QBANK.push(
  { id: 'ch4-1', ch: 4, type: 'single', q: '以下选项中，不属于C语句的是（　）。', opts: ['a = 3 * 5', ';', '{ a = 1; b = 2; }', 'a = 3;'], ans: 0, exp: '表达式后面加上分号才是表达式语句，a=3*5 没加分号只是表达式；; 是空语句，{} 括起来的是复合语句，a=3; 是表达式语句。' },
  { id: 'ch4-2', ch: 4, type: 'single', q: '以下选项中，属于复合语句的是（　）。', opts: ['a = 1;', ';', '{ int t; t = a; a = b; b = t; }', 'printf("hi");'], ans: 2, exp: '用一对花括号把若干语句括起来就构成复合语句，语法上相当于一条语句；{} 外面不需要再加分号。' },
  { id: 'ch4-3', ch: 4, type: 'single', q: '语句 printf("a=%d,b=%d", 3, 4 + 5); 的输出结果是（　）。', opts: ['a=3,b=9', 'a=%d,b=%d', 'a=3,b=4', 'a=3,b=45'], ans: 0, exp: '格式串中的 %d 依次被输出列表中的数据替换，4+5 先算出 9 再输出；a=、b= 和逗号都是普通字符，原样输出。' },
  { id: 'ch4-4', ch: 4, type: 'single', q: '语句 printf("%5d", 42); 的输出结果是（　）。（选项中□表示一个空格）', opts: ['42□□□', '□□□42', '00042', '□□42'], ans: 1, exp: '%5d 指定输出宽度为 5，数据不足 5 位时右对齐、左边补空格，所以是 3 个空格加 42；printf 不会用 0 填充。' },
  { id: 'ch4-5', ch: 4, type: 'single', q: '语句 printf("%.2f", 3.14159); 的输出结果是（　）。', opts: ['3.14159', '3.1', '3.15', '3.14'], ans: 3, exp: '%.2f 表示保留 2 位小数输出，第 3 位四舍五入：3.14159 的小数点后第 3 位是 1，舍去得 3.14。' },
  { id: 'ch4-6', ch: 4, type: 'single', q: '语句 printf("%5.2f", 3.14159); 的输出结果是（　）。（选项中□表示一个空格）', opts: ['3.14□', '□3.14', '3.14', '□□3.14'], ans: 1, exp: '%5.2f 中 5 是总宽度（含小数点）、2 是小数位数：3.14 只有 4 位，右对齐左边补 1 个空格，即 □3.14。' },
  { id: 'ch4-7', ch: 4, type: 'single', q: '语句 printf("%-8.2f", 1.5); 的输出结果是（　）。（选项中□表示一个空格）', opts: ['□□□□1.50', '1.500000', '1.50□□□□', '1.50'], ans: 2, exp: '%-8.2f 中的负号表示左对齐：输出 1.50 后右边补 4 个空格凑满总宽度 8；没有负号时空格补在左边。' },
  { id: 'ch4-8', ch: 4, type: 'single', q: '设有定义 double x = 2.5; 语句 printf("%f", x); 的输出结果是（　）。', opts: ['2.5', '2.500000', '2.50', '%f'], ans: 1, exp: '%f 默认输出 6 位小数，不足的补 0，所以输出 2.500000；只想输出 2 位小数要写成 %.2f。' },
  { id: 'ch4-9', ch: 4, type: 'single', q: '已有定义 int a; 要通过键盘输入 a 的值，正确的输入语句是（　）。', opts: ['scanf("%d", a);', 'scanf("%lf", &a);', 'scanf("%d", *a);', 'scanf("%d", &a);'], ans: 3, exp: 'scanf 必须把变量的地址告诉它，普通变量前要加 & 取地址；%lf 对应 double，int 型要用 %d。' },
  { id: 'ch4-10', ch: 4, type: 'single', q: '执行 scanf("%d%d", &a, &b); 时，输入的两个整数之间可以用下列哪个字符分隔（　）。', opts: ['逗号', '分号', '空格', '冒号'], ans: 2, exp: '多个 %d 之间可用空格、回车或 Tab 键分隔（它们都是空白符）；逗号不是分隔符，除非格式串本身写成"%d,%d"。' },
  { id: 'ch4-11', ch: 4, type: 'single', q: '已有定义 int n; char c; 执行 scanf("%d%c", &n, &c); 时从键盘输入（12 与 A 之间有一个空格）：\n12 A\n则变量 c 得到的字符是（　）。', opts: ['字母A', '回车符', '空格', '数字1'], ans: 2, exp: '%c 不跳过空格和回车：%d 读走 12 后，紧跟其后的空格被 %c 读走，所以 c 得到的是空格；想读到 A 应输入 12A。' },
  { id: 'ch4-12', ch: 4, type: 'single', q: '已有定义 double d; 下列正确的输入语句是（　）。', opts: ['scanf("%f", &d);', 'scanf("%lf", d);', 'scanf("%d", &d);', 'scanf("%lf", &d);'], ans: 3, exp: 'double 变量用 scanf 读入必须用 %lf，写成 %f 读不进去；漏写 & 也不行。输出时用 %f 即可。' },
  { id: 'ch4-13', ch: 4, type: 'single', q: '关于赋值语句和赋值表达式，下列说法正确的是（　）。', opts: ['赋值表达式有值，可以嵌套在其他表达式中；赋值语句以分号结尾，不能再嵌套', '两者完全相同，可以混用', '赋值语句可以出现在算术表达式中', '赋值表达式末尾必须写分号'], ans: 0, exp: '如 x=(a=5)+2 中嵌套的是赋值表达式（它有值）；加了分号就成了语句，语句不能再作为表达式的一部分。' },
  { id: 'ch4-14', ch: 4, type: 'single', q: '语句 printf("%x,%o", 255, 8); 的输出结果是（　）。', opts: ['ff,10', 'FF,8', '255,10', 'ff,8'], ans: 0, exp: '%x 按十六进制输出：255 的十六进制是 ff；%o 按八进制输出：8 的八进制是 10。' },
  { id: 'ch4-15', ch: 4, type: 'judge', q: 'printf 函数的格式串中，%% 用来输出一个百分号本身。', opts: ['正确', '错误'], ans: 0, exp: '% 在格式串中是特殊字符，想输出百分号本身必须连写两个：printf("100%%") 输出 100%。' },
  { id: 'ch4-16', ch: 4, type: 'judge', q: 'getchar() 每次只能读取一个字符，回车符也会作为一个有效字符被读入。', opts: ['正确', '错误'], ans: 0, exp: 'getchar 一次从输入缓冲区读一个字符，空格、回车都不跳过；连续输入 ab 后回车，第三个 getchar 读到的就是回车符。' },
  { id: 'ch4-17', ch: 4, type: 'judge', q: 'scanf 语句中如果漏写了取地址符 &，编译时一定会报错，程序无法通过编译。', opts: ['正确', '错误'], ans: 1, exp: '漏写 & 在语法上没错，编译一般能通过，但输入的数据存不进变量，运行时可能出错或结果不对，是最常见的隐蔽错误。' },
  { id: 'ch4-18', ch: 4, type: 'blank', q: '下面程序的功能是输入两个整数并原样输出，请补全程序：\n#include <stdio.h>\nint main()\n{\n    int a, b;\n    printf("input a and b:");\n    scanf("%d%d", ____);\n    printf("a=%d,b=%d\\n", a, b);\n    return 0;\n}\n横线处应填（　）。', opts: ['a, b', '&a, &b', '*a, *b', 'a, &b'], ans: 1, exp: 'scanf 需要的是变量的地址，普通变量前必须加 &：&a, &b；直接写 a、b 传的是值不是地址，输入存不进变量。' },
  { id: 'ch4-19', ch: 4, type: 'blank', q: '下面程序要按保留 2 位小数的格式输出平均分，请补全程序：\n#include <stdio.h>\nint main()\n{\n    double s = 85.678;\n    printf("avg=____\\n", s);   /* 保留 2 位小数 */\n    return 0;\n}\n横线处应填（　）。', opts: ['%.2d', '%2f', '%.2f', '%.f2'], ans: 2, exp: '%.2f 按 2 位小数输出（四舍五入得 85.68）；%.2d 是整数格式符；%2f 里的宽度 2 起不了作用，仍按 %f 输出 6 位小数。' },
  { id: 'ch4-20', ch: 4, type: 'blank', q: '下面程序的功能是交换两个变量的值，请补全程序：\n#include <stdio.h>\nint main()\n{\n    int a = 3, b = 5, t;\n    ____;        /* 将 a 的值暂存到 t 中 */\n    a = b;\n    b = t;\n    printf("a=%d,b=%d\\n", a, b);\n    return 0;\n}\n横线处应填（　）。', opts: ['a = t', 't = b', 'b = t', 't = a'], ans: 3, exp: '三变量交换的固定套路：t=a 暂存 → a=b → b=t，执行后 a=5、b=3；若第一句写成 a=t，t 还没有值，交换就乱了。' },
  { id: 'ch4-21', ch: 4, type: 'read', q: '有以下程序\n#include <stdio.h>\nint main()\n{\n    int a = 42;\n    double x = 3.14159;\n    printf("%d\\n", a);\n    printf("%5d\\n", a);\n    printf("%.2f\\n", x);\n    return 0;\n}\n程序运行后的输出结果是（　）。（选项中□表示一个空格）', opts: ['42\\n42□□□\\n3.14', '42\\n□□□42\\n3.14159', '42\\n□□□42\\n3.14', '42\\n□□□42\\n3.15'], ans: 2, exp: '42 按 %d 原样输出；%5d 宽度 5 右对齐，左边补 3 个空格；%.2f 保留 2 位小数得 3.14。' },
  { id: 'ch4-22', ch: 4, type: 'read', q: '有以下程序\n#include <stdio.h>\nint main()\n{\n    int n;\n    char c;\n    scanf("%d%c", &n, &c);\n    printf("n=%d,c=%c\\n", n, c);\n    return 0;\n}\n运行时输入（12 与 A 之间有一个空格）：12 A\n程序运行后的输出结果是（　）。（选项中□表示一个空格）', opts: ['n=12,c=A', 'n=12,c=□', 'n=1,c=2', 'n=12,c=12'], ans: 1, exp: '%d 读走 12 后，%c 不跳过空格，把紧随其后的空格读走，所以输出 n=12,c=□。这是 %d 和 %c 连用时的经典陷阱。' },
  { id: 'ch4-23', ch: 4, type: 'read', q: '有以下程序\n#include <stdio.h>\nint main()\n{\n    char c1, c2, c3;\n    c1 = getchar();\n    c2 = getchar();\n    c3 = getchar();\n    putchar(c1);\n    putchar(c2);\n    putchar(c3);\n    return 0;\n}\n运行时输入：ab 后回车\n程序运行后的输出结果是（　）。', opts: ['输出ab后换一行', '输出ab后不换行', '只输出a', '输出abab'], ans: 0, exp: '前两个 getchar 读到 a 和 b，第三个读到的是回车符；putchar 把它原样输出，效果就是输出 ab 后换行。回车也算一个字符。' },
  { id: 'ch4-24', ch: 4, type: 'read', q: '有以下程序\n#include <stdio.h>\nint main()\n{\n    int a = 7, b = 2;\n    double m;\n    m = a / b;\n    printf("m=%.2f\\n", m);\n    printf("r=%d\\n", a % b);\n    return 0;\n}\n程序运行后的输出结果是（　）。', opts: ['m=3.50\\nr=1', 'm=3\\nr=1', 'm=3.00\\nr=1.0', 'm=3.00\\nr=1'], ans: 3, exp: 'a/b 是两个 int 先整除得 3，再转 double 得 3.00（不是 3.50）；7%2=1。整数除法发生在赋值之前。' },
  { id: 'ch4-25', ch: 4, type: 'code',

<script>
// 第5章 选择结构程序设计
window.QBANK = window.QBANK || [];
window.NOTES = window.NOTES || {};
window.NOTES[5] = {
  title: '第5章 选择结构程序设计',
  points: '<h3>📌 本章考点清单</h3>' +
    '<ul>' +
    '<li><b>关系运算符</b>：&lt; &lt;= &gt; &gt;= 优先级相同（高于 == !=）；关系表达式的值只有 1（真）和 0（假）。</li>' +
    '<li><b>逻辑运算符</b>：优先级 ! → &amp;&amp; → ||；C语言里<b>任意非 0 值都算真</b>（-1 也是真）。</li>' +
    '<li><b>优先级链</b>（高→低）：! → 算术 → 关系 → &amp;&amp; → || → 赋值=。</li>' +
    '<li><b>短路求值</b>：a&amp;&amp;b 左边为 0 时右边不算；a||b 左边非 0 时右边不算。</li>' +
    '<li><b>if 三种形式</b>：单分支、双分支 if-else、多分支 if-else if-else；if(x) 等价于 if(x!=0)。</li>' +
    '<li><b>else 配对</b>：与前面最近的、尚未配对的 if 配对，与缩进无关。</li>' +
    '<li><b>条件表达式</b>：a&gt;b ? a : b，与 if-else 可互相改写。</li>' +
    '<li><b>switch</b>：case 后只能是常量或常量表达式；无 break 时落空往下执行；所有 case 都不匹配才执行 default。</li>' +
    '</ul>' +
    '<h3>📖 核心讲解</h3>' +
    '<p><b>1. 关系表达式的值是 1 或 0</b>：3+2&gt;4 先算 3+2 得 5，再算 5&gt;4，整个表达式值为 1，可以赋给 int 变量。连续比较 c&gt;b&gt;a 是从左到右一步步算，不是数学上的含义。</p>' +
    '<p><b>2. == 与 = 混用（必考送分题）</b></p>' +
    '<pre>if(a=5)   赋值，表达式值恒为 5，条件恒真\nif(a=0)   赋值 0，条件恒假，else 分支必执行\nif(a==5)  这才是判断 a 是否等于 5</pre>' +
    '<p><b>3. 闰年表达式（必背）</b>：year%4==0 &amp;&amp; year%100!=0 || year%400==0。&amp;&amp; 优先级高于 ||，不加括号也正确，但加括号更清晰。</p>' +
    '<p><b>4. 短路求值（读程序高频）</b></p>' +
    '<pre>int a=1, b=2, c=3, d=4, m=1, n=1;\n(m=a&gt;b) &amp;&amp; (n=c&gt;d);\n/* a&gt;b 为 0，m 被赋成 0；左边已假，\n   右边 n=c&gt;d 不执行，n 仍是 1 */</pre>' +
    '<p><b>5. if 三种形式模板</b></p>' +
    '<pre>/* 单分支 */\nif(x &gt; 0)\n    printf("positive");\n\n/* 双分支 */\nif(a &gt; b)\n    max = a;\nelse\n    max = b;\n\n/* 多分支：从上往下依次判断，命中一个分支后其余全跳过 */\nif(score &gt;= 90)      printf("A");\nelse if(score &gt;= 80) printf("B");\nelse if(score &gt;= 60) printf("C");\nelse                 printf("D");</pre>' +
    '<p><b>6. 悬空 else</b></p>' +
    '<pre>if(a &gt; 5)\n    if(b &gt; 5)\n        printf("A");\n    else\n        printf("B");\n/* else 与内层 if 配对（最近的未配对 if），\n   外层条件为假时整个 if-else 都不执行 */</pre>' +
    '<p><b>7. 条件表达式</b>：max = (a&gt;b) ? a : b; 等价于 if-else 双分支。问号后是"条件成立"的结果，冒号后是"不成立"的结果。</p>' +
    '<p><b>8. switch 模板与 break 的作用</b></p>' +
    '<pre>switch(score / 10)\n{\ncase 10:\ncase 9:  printf("A"); break;   /* 10 和 9 共用一段：前一个 case 落空 */\ncase 8:  printf("B"); break;\ncase 6:  printf("D"); break;\ndefault: printf("E");          /* 最后一段可不加 break */\n}\n/* 没 break 会继续往下执行后面 case 的语句；\n   所有 case 都不匹配时从 default 开始执行；\n   case 后只能是整型/字符型常量，不能是变量、实型或区间 */</pre>' +
    '<h3>⚠️ 易错陷阱清单</h3>' +
    '<ul>' +
    '<li>把 <b>== 写成 =</b>：if(a=5) 恒真、if(a=0) 恒假，而且 a 的值被偷偷改掉。</li>' +
    '<li>if 后面<b>乱加分号</b>：if(a&gt;b); 相当于条件只控制一条空语句，后面的语句照常执行。</li>' +
    '<li>if 后多条语句<b>不加花括号</b>：只有第一条受控制。经典题 if(a&gt;b) t=a; b=a; a=b; 只有 t=a 受控，输出 1,1。</li>' +
    '<li><b>else 配对</b>看结构不看缩进：总是配最近的未配对 if。</li>' +
    '<li>switch <b>忘写 break</b> 导致落空；case 后写变量、实型常量、case 90..100 这种区间都是错的。</li>' +
    '<li>逻辑运算里<b>非 0 都算真</b>：!(-1) 是 0，!0 是 1；x 为负数时 if(x) 同样成立。</li>' +
    '<li>关系表达式连写 a&lt;b&lt;c 不等于数学含义：先算 a&lt;b 得 0 或 1，再拿 0 或 1 和 c 比。</li>' +
    '</ul>'
};
window.QBANK.push(
  { id: 'ch5-1', ch: 5, type: 'single', q: '下列运算符中，优先级最高的是（　）。', opts: ['==', '>=', '&&', '||'], ans: 1, exp: '关系运算符（如>=）优先级高于相等运算符==，更高于逻辑运算符&&和||。优先级链：关系 → == != → && → ||。' },
  { id: 'ch5-2', ch: 5, type: 'single', q: '在C语言中，关系表达式 a>b 的值是（　）。', opts: ['0或1', 'true或false', 'a和b中较大的值', '无法确定'], ans: 0, exp: 'C语言没有true/false这种布尔值，关系表达式的值用 1 表示真、0 表示假，是 int 型的 1 和 0。' },
  { id: 'ch5-3', ch: 5, type: 'single', q: '已知 int a=3, b=4, c=5; 则表达式 c>b>a 的值是（　）。', opts: ['1', '5', '0', '语法错误'], ans: 2, exp: '关系运算符从左到右结合：先算 c>b 即 5>4 得 1，再算 1>a 即 1>3 得 0。连续比较要一步步算，不能按数学含义理解。' },
  { id: 'ch5-4', ch: 5, type: 'single', q: '有以下程序段：\nint a=0;\nif(a=5)\n    printf("yes");\nelse\n    printf("no");\n执行后的输出是（　）。', opts: ['no', 'yes', '不输出任何内容', '编译出错'], ans: 1, exp: 'if(a=5) 括号里是赋值不是判断，赋值表达式的值是 5，非 0 即真，所以输出 yes。最经典的 = 与 == 混用陷阱。' },
  { id: 'ch5-5', ch: 5, type: 'single', q: '已知 int a=1, b=2, c=3, d=4, m=1, n=1;\n执行语句 (m=a>b) && (n=c>d); 后，m、n 的值是（　）。', opts: ['m=0, n=1', 'm=0, n=0', 'm=1, n=1', 'm=0, n=4'], ans: 0, exp: 'a>b 为假，m 被赋成 0；&& 左边为 0 时发生短路，右边 n=c>d 不被执行，n 保持原值 1。这是短路求值的经典考题。' },
  { id: 'ch5-6', ch: 5, type: 'single', q: '能正确表示"year 是闰年"的逻辑表达式是（　）。', opts: ['year%4==0', 'year%400==0', '(year%4==0 && year%100!=0) || year%400==0', 'year%4!=0 || year%100!=0'], ans: 2, exp: '闰年条件：能被4整除但不能被100整除，或者能被400整除。只写 year%4==0 会把 1900 这种整百年误判成闰年。' },
  { id: 'ch5-7', ch: 5, type: 'single', q: '与 if(x) 中的条件（x 为 int 型）完全等价的写法是（　）。', opts: ['if(x==0)', 'if(x!=0)', 'if(x>0)', 'if(x==1)'], ans: 1, exp: 'if(x) 的含义是 x 非 0 就成立，等价于 if(x!=0)。x 为 -1 时条件也成立，所以 if(x>0) 不等价。' },
  { id: 'ch5-8', ch: 5, type: 'single', q: '有以下程序段：\nint a=2, b=3;\nif(a>5)\n    if(b>5)\n        printf("A");\n    else\n        printf("B");\nprintf("C");\n执行后的输出是（　）。', opts: ['A', 'B', 'C', 'BC'], ans: 2, exp: 'else 与它前面最近的未配对 if（内层 if(b>5)）配对。外层条件 a>5 为假，内层整个 if-else 都不执行，只输出最后的 C。' },
  { id: 'ch5-9', ch: 5, type: 'single', q: '有以下程序段：\nint a=1, b=2, t;\nif(a>b)\n    t=a;\nb=a;\na=b;\nprintf("%d,%d", a, b);\n执行后的输出是（　）。', opts: ['1,2', '2,1', '2,2', '1,1'], ans: 3, exp: 'if 后面没有花括号，只能控制紧跟的一条语句 t=a。条件为假 t=a 不执行；b=a 使 b 变 1，a=b 使 a 变 1，输出 1,1。想交换必须给三条语句加花括号。' },
  { id: 'ch5-10', ch: 5, type: 'single', q: '已知 int x=-5, y;\ny = x>0 ? 1 : -1;\n则 y 的值是（　）。', opts: ['1', '0', '-1', '-5'], ans: 2, exp: 'x=-5 不大于 0，条件表达式取冒号后面的 -1。它等价于 if(x>0) y=1; else y=-1; 双分支。' },
  { id: 'ch5-11', ch: 5, type: 'single', q: '关于 switch 语句中 case 后面的内容，下列说法正确的是（　）。', opts: ['可以是变量', '可以是实型常量', '可以是任意表达式', '只能是整型或字符型的常量、常量表达式，且各 case 互不相同'], ans: 3, exp: 'case 后只能放整型或字符型常量（常量表达式），不能用变量、实型，也不能写区间。' },
  { id: 'ch5-12', ch: 5, type: 'single', q: '有以下程序段：\nint x=2;\nswitch(x)\n{\ncase 1: printf("1");\ncase 2: printf("2");\ncase 3: printf("3"); break;\ncase 4: printf("4");\n}\n执行后的输出是（　）。', opts: ['2', '23', '234', '123'], ans: 1, exp: '从 case 2 进入输出 2，case 2 后没有 break，落空继续执行 case 3 输出 3，遇到 break 才结束。case 1 在入口之前，不会被执行。' },
  { id: 'ch5-13', ch: 5, type: 'single', q: '有以下程序段：\nint x=5;\nswitch(x)\n{\ncase 1: printf("A"); break;\ndefault: printf("D");\ncase 2: printf("B");\n}\n执行后的输出是（　）。', opts: ['A', 'B', 'D', 'DB'], ans: 3, exp: 'x=5 没有匹配的 case，从 default 进入输出 D；default 后面没有 break，继续落空执行 case 2 的语句输出 B。' },
  { id: 'ch5-14', ch: 5, type: 'single', q: '逻辑运算符 !、&&、|| 按优先级从高到低排列，正确的是（　）。', opts: ['! → && → ||', '&& → ! → ||', '|| → && → !', '&& → || → !'], ans: 0, exp: '! 最高，&& 其次，|| 最低。完整优先级链是：! → 算术 → 关系 → && → || → 赋值。' },
  { id: 'ch5-15', ch: 5, type: 'judge', q: '在C语言中，if(a=0) 与 if(a==0) 的判断效果相同。', opts: ['正确', '错误'], ans: 1, exp: 'if(a=0) 是赋值，表达式值恒为 0，条件恒假；if(a==0) 才是判断 a 是否等于 0，两者效果不同。' },
  { id: 'ch5-16', ch: 5, type: 'judge', q: 'else 总是与它前面最近的、尚未配对的 if 配对。', opts: ['正确', '错误'], ans: 0, exp: 'else 配对只看结构（最近的未配对 if），与缩进和书写位置无关。' },
  { id: 'ch5-17', ch: 5, type: 'judge', q: 'switch 语句中，每个 case 后面都必须写 break 语句，否则编译出错。', opts: ['正确', '错误'], ans: 1, exp: 'break 可以省略，省略后发生"落空"，继续执行后面 case 的语句，这不是语法错误。case 10: case 9: 共用一段正是利用落空。' },
  { id: 'ch5-18', ch: 5, type: 'judge', q: 'if 语句的条件可以是任意表达式，只要表达式的值非 0 就执行 if 后面的语句。', opts: ['正确', '错误'], ans: 0, exp: 'if 的条件不限于关系或逻辑表达式，赋值、算术表达式都可以，判据是"非 0 即真"。' },
  { id: 'ch5-19', ch: 5, type: 'blank', q: '程序功能：输入两个整数，输出较大的数。请补全 if 括号中的条件。\n#include <stdio.h>\nint main()\n{\n    int a, b, max;\n    scanf("%d%d", &a, &b);\n    if(____)\n        max = a;\n    else\n        max = b;\n    printf("max=%d", max);\n    return 0;\n}', opts: ['a<b', 'a==b', 'a>b', 'max>a'], ans: 2, exp: 'a>b 成立说明较大的是 a，把 a 赋给 max；否则较大的是 b。注意条件是关系表达式 a>b，不能写成赋值 a=b。' },
  { id: 'ch5-20', ch: 5, type: 'blank', q: '程序功能：输入百分制成绩，用 switch 输出等级。请补全 switch 括号中的表达式。\n#include <stdio.h>\nint main()\n{\n    int score;\n    scanf("%d", &score);\n    switch(____)\n    {\n    case 10:\n    case 9: printf("A"); break;\n    case 8: printf("B"); break;\n    case 7: printf("C"); break;\n    case 6: printf("D"); break;\n    default: printf("E");\n    }\n    return 0;\n}', opts: ['score%10', 'score/10', 'score*10', 'score-10'], ans: 1, exp: 'score/10 把成绩压缩成 0~10 的整数，才能与 case 9、case 8 等常量一一对应。score%10 得到的是个位数字，无法划分等级。' },
  { id: 'ch5-21', ch: 5, type: 'blank', q: '程序功能：输入一个整数，偶数输出 ou，奇数输出 ji。请补全关键字。\n#include <stdio.h>\nint main()\n{\n    int x;\n    scanf("%d", &x);\n    if(x%2==0)\n        printf("ou");\n    ____\n        printf("ji");\n    return 0;\n}', opts: ['else', 'else if', 'if', 'break'], ans: 0, exp: '这是 if-else 双分支：条件成立走 if 分支，不成立走 else 分支，else 后面不能再跟条件。' },
  { id: 'ch5-22', ch: 5, type: 'read', q: '写出下面程序的运行结果。\n#include <stdio.h>\nint main()\n{\n    int a=2, b=3, c=1;\n    if(a>b)\n        if(a>c)\n            printf("%d", a);\n        else\n            printf("%d", b);\n    return 0;\n}', opts: ['2', '3', '无任何输出', '编译错误'], ans: 2, exp: 'else 与内层 if(a>c) 配对。外层条件 a>b 即 2>3 为假，内层整个 if-else 都不执行，程序没有任何输出。这是悬空 else 的经典题。' },
  { id: 'ch5-23', ch: 5, type: 'read', q: '写出下面程序的运行结果。\n#include <stdio.h>\nint main()\n{\n    int x=0;\n    if(x>0)\n        printf("1");\n    else if(x==0)\n        printf("0");\n    else\n        printf("-1");\n    return 0;\n}', opts: ['-1', '0', '1', '不输出'], ans: 1, exp: '多分支从上往下判断：x>0 不成立，x==0 成立就执行第二个分支输出 0，后面的分支不再判断。整个 if-else if-else 只会执行其中一个分支。' },
  { id: 'ch5-24', ch: 5, type: 'code', q: '编写完整程序：输入一个年份 year，判断它是否为闰年。闰年条件：能被4整除但不能被100整除，或者能被400整除。是闰年输出 yes，否则输出 no。', sample: '#include <stdio.h>\nint main()\n{\n    int year;\n    scanf("%d", &year);\n    if((year%4==0 && year%100!=0) || year%400==0)\n        printf("yes\\n");\n    else\n        printf("no\\n");\n    return 0;\n}', exp: '思路：闰年 =（能被4整除且不能被100整除）或（能被400整除），把这句话直接翻译成一个逻辑表达式，配合 if-else 输出。要点：% 是求余；&& 比 || 优先级高；输入用 scanf("%d",&year)。例如 2000 输出 yes，1900 输出 no。' },
  { id: 'ch5-25', ch: 5, type: 'code', q: '编写完整程序：输入一个百分制成绩 score（0~100 的整数），用 switch 语句输出等级：90~100 为 A，80~89 为 B，70~79 为 C，60~69 为 D，60 以下为 E。', sample: '#include <stdio.h>\nint main()\n{\n    int score;\n    scanf("%d", &score);\n    switch(score/10)\n    {\n    case 10:\n    case 9:  printf("A\\n"); break;\n    case 8:  printf("B\\n"); break;\n    case 7:  printf("C\\n"); break;\n    case 6:  printf("D\\n"); break;\n    default: printf("E\\n");\n    }\n    return 0;\n}', exp: '思路：case 后只能写单个常量，写不了区间，所以用 score/10 把 100 种取值压缩成 0~10 共 11 种。case 10 和 case 9 后面都不写语句，落空到下一行共用 printf("A")；每个等级后必须 break 防止落空；default 处理 60 分以下。' }
);

<script>
// 第6章 循环控制
window.QBANK = window.QBANK || [];
window.NOTES = window.NOTES || {};
window.NOTES[6] = {
  title: '第6章 循环控制',
  points: '<h3>📌 本章考点清单</h3>' +
    '<ul>' +
    '<li><b>while</b>：先判断后执行，条件一开始为假则循环体一次都不执行（最少 0 次）。</li>' +
    '<li><b>do-while</b>：先执行后判断，循环体至少执行 1 次；while(表达式) 后面<b>必须有分号</b>。</li>' +
    '<li><b>for(表达式1;表达式2;表达式3)</b>：执行顺序 表达式1 → 表达式2 → 循环体 → 表达式3 → 表达式2…；三个表达式都可省，但两个分号不能省，for(;;) 是死循环。</li>' +
    '<li><b>break</b>：跳出<b>本层</b>循环（或 switch）；<b>continue</b>：结束本次循环，进入下一次循环的判定。</li>' +
    '<li><b>嵌套循环</b>：外层 m 次、内层 n 次，内层循环体共执行 m×n 次；break 只跳出一层。</li>' +
    '<li><b>累加先清零、累乘先置 1</b>；循环变量必须更新，否则死循环。</li>' +
    '<li><b>goto 与语句标号</b>：同一函数内跳转，可以构成循环，考试只要求了解。</li>' +
    '</ul>' +
    '<h3>📖 核心讲解</h3>' +
    '<p><b>1. 三种循环对比（必考）</b></p>' +
    '<table><tr><th></th><th>while</th><th>do-while</th><th>for</th></tr>' +
    '<tr><td>执行顺序</td><td>先判断后执行</td><td>先执行后判断</td><td>表达式1→判断→体→表达式3</td></tr>' +
    '<tr><td>最少执行次数</td><td>0 次</td><td>1 次</td><td>0 次</td></tr>' +
    '<tr><td>适用场景</td><td>次数不确定</td><td>至少做一次（如菜单）</td><td>次数已知（最常用）</td></tr></table>' +
    '<p>三种循环可以互相转换、互相嵌套。条件一开始就为假时：while 执行 0 次，do-while 执行 1 次。</p>' +
    '<p><b>2. for 的执行流程</b>（口诀：①②④③ 循环）</p>' +
    '<pre>for(i=0; i&lt;10; i++)\n    ① i=0          只做 1 次\n    ② i&lt;10 成立？   不成立就退出\n    ④ 循环体\n    ③ i++          然后回到 ②\n/* 循环正常结束时 i=10（第一次不满足条件的值） */</pre>' +
    '<p><b>3. while 与 do-while 的区别</b></p>' +
    '<pre>int x = 10;\nwhile(x &lt; 5) { printf("*"); }      /* 先判断：条件为假，0 个 * */\ndo { printf("*"); } while(x &lt; 5);  /* 先执行一次：1 个 * */</pre>' +
    '<p><b>4. break 与 continue 对比</b></p>' +
    '<pre>for(i=1; i&lt;=5; i++)\n{\n    if(i==3) break;      /* break 跳出整个循环：输出 12 */\n    printf("%d", i);\n}\nfor(i=1; i&lt;=5; i++)\n{\n    if(i==3) continue;   /* continue 只跳过 i=3 这次：输出 1245 */\n    printf("%d", i);\n}</pre>' +
    '<p><b>5. 死循环的写法与退出</b></p>' +
    '<pre>for(;;) { ... }     /* 三个表达式全省，条件恒真 */\nwhile(1) { ... }    /* 条件恒真 */\n/* 循环体内忘记写 i++ 也是死循环 */\n/* 退出方式：break、return、goto */</pre>' +
    '<p><b>6. 经典算法套路（背模板）</b></p>' +
    '<p><b>累加</b>——和先清零：</p>' +
    '<pre>s = 0;\nfor(i=1; i&lt;=100; i++)\n    s = s + i;          /* 1~100 的和 5050 */</pre>' +
    '<p><b>累乘</b>——积先置 1：</p>' +
    '<pre>f = 1;\nfor(i=1; i&lt;=n; i++)\n    f = f * i;          /* n! */</pre>' +
    '<p><b>偶数和</b>：i 从 2 开始每次加 2，或逐个判断 i%2==0。1~100 偶数和是 2550。</p>' +
    '<p><b>计数</b>——计数器清零，满足条件加 1：</p>' +
    '<pre>c = 0;\nfor(i=1; i&lt;=100; i++)\n    if(i%3==0) c++;     /* 统计 1~100 中 3 的倍数个数 */</pre>' +
    '<p><b>水仙花数</b>（三位数等于各位数字的立方和）——关键是分离各位：</p>' +
    '<pre>a = n/100; b = n/10%10; c = n%10;   /* 百位、十位、个位 */\nif(a*a*a + b*b*b + c*c*c == n) printf("%d", n);</pre>' +
    '<p><b>素数判断</b>：</p>' +
    '<pre>for(i=2; i&lt;=n-1; i++)\n    if(n%i == 0) break;      /* 能被整除，不是素数 */\nif(i &gt;= n) printf("yes");    /* 循环跑完都没被整除则是素数 */</pre>' +
    '<p><b>斐波那契数列</b>（1 1 2 3 5 8 …）——滚动递推：</p>' +
    '<pre>f1 = 1; f2 = 1;\nfor(i=1; i&lt;=20; i++)\n{\n    printf("%d %d ", f1, f2);\n    f1 = f1 + f2;    /* f1 变成下一项 */\n    f2 = f1 + f2;    /* f2 变成再下一项 */\n}</pre>' +
    '<p><b>九九乘法表</b>——嵌套循环 + 换行：</p>' +
    '<pre>for(i=1; i&lt;=9; i++)\n{\n    for(j=1; j&lt;=i; j++)\n        printf("%d*%d=%d  ", j, i, i*j);\n    printf("\\n");        /* 每行结束换行 */\n}</pre>' +
    '<h3>⚠️ 易错陷阱清单</h3>' +
    '<ul>' +
    '<li><b>while() 后多写分号</b>：while(i&lt;10); 循环体变成空语句，可能死循环。</li>' +
    '<li><b>do-while 少分号</b>：}while(表达式) 后面的分号不能省，省了语法错误。</li>' +
    '<li><b>循环变量不更新</b>：循环体内忘记 i++，条件永远成立，死循环。</li>' +
    '<li><b>把 = 当 ==</b>：while(i=1) 是赋值，值恒为 1，死循环。</li>' +
    '<li><b>for 后多分号</b>：for(i=0;i&lt;10;i++); 分号成了循环体，后面的语句只执行一次。</li>' +
    '<li><b>break 与 continue 用混</b>：break 跳出整层循环，continue 只跳过本次；break 不能用在单独的 if 里（必须处在循环或 switch 中）。</li>' +
    '<li><b>累加不清零、累乘不置 1</b>：s 没清零会多加；f 初值为 0 则乘积恒为 0。</li>' +
    '<li><b>嵌套循环</b>：内外层不能用同一个循环变量；break 只跳出它所在的那一层。</li>' +
    '</ul>'
};
window.QBANK.push(
  { id: 'ch6-1', ch: 6, type: 'single', q: '关于 while 语句和 do-while 语句，下列说法正确的是（　）。', opts: ['两者都至少执行 1 次循环体', '两者都可能一次也不执行循环体', '当循环条件一开始就为假时，while 执行 0 次，do-while 执行 1 次', '当循环条件一开始就为假时，while 执行 1 次，do-while 执行 0 次'], ans: 2, exp: 'while 先判断后执行，条件为假一次都不做；do-while 先执行后判断，无论条件如何至少做 1 次。' },
  { id: 'ch6-2', ch: 6, type: 'single', q: 'do-while 语句中，while(表达式) 的末尾（　）。', opts: ['必须有分号', '可有可无', '必须没有分号', '必须用逗号'], ans: 0, exp: 'do-while 的语法是 do 循环体 while(表达式); 这个分号是语句结束的标志，不能省。' },
  { id: 'ch6-3', ch: 6, type: 'single', q: 'for(表达式1; 表达式2; 表达式3) { 循环体 } 的执行顺序是（　）。', opts: ['表达式1 → 表达式2 → 表达式3 → 循环体，循环', '表达式1 → 循环体 → 表达式2 → 表达式3，循环', '表达式2 → 表达式1 → 循环体 → 表达式3，循环', '表达式1 → 表达式2 → 循环体 → 表达式3，再回到表达式2'], ans: 3, exp: '表达式1 只执行一次，之后不断重复"表达式2判断 → 循环体 → 表达式3"；表达式3 在循环体之后才执行。' },
  { id: 'ch6-4', ch: 6, type: 'single', q: '执行 for(i=0; i<10; i+=3) printf("*"); 后，输出的 * 个数和循环结束时 i 的值是（　）。', opts: ['4次，结束时 i=12', '3次，结束时 i=9', '4次，结束时 i=10', '10次，结束时 i=12'], ans: 0, exp: 'i 依次取 0、3、6、9，共执行 4 次；i 加到 12 时 12<10 不成立退出，i 最终是 12 而不是 10。' },
  { id: 'ch6-5', ch: 6, type: 'single', q: '有以下程序段：\nint i;\nfor(i=0; i<10; i++);\nprintf("%d", i);\n执行后的输出是（　）。', opts: ['0123456789', '10', '012345678910', '9'], ans: 1, exp: 'for 后面的分号是一条空语句，它才是循环体，printf 不在循环内。循环结束后 i=10，只输出 10。易错点：for() 后多写分号。' },
  { id: 'ch6-6', ch: 6, type: 'single', q: 'continue 语句的作用是（　）。', opts: ['结束本次循环，接着进行下一次是否循环的判定', '终止整个循环的执行', '跳出 switch 语句', '结束整个程序的运行'], ans: 0, exp: 'continue 只跳过本次循环体中剩下的语句，回到条件判断处；终止整个循环用的是 break。' },
  { id: 'ch6-7', ch: 6, type: 'single', q: '有以下程序段：\nint i;\nfor(i=1; i<=5; i++)\n{\n    if(i==3) break;\n    printf("%d", i);\n}\n执行后的输出是（　）。', opts: ['12345', '1245', '12', '123'], ans: 2, exp: 'i=1、2 时输出 1、2；i=3 时遇到 break 直接跳出循环，4、5 不再执行。若换成 continue 则输出 1245。' },
  { id: 'ch6-8', ch: 6, type: 'single', q: '在双重循环中，内层循环体里的 break 语句（　）。', opts: ['跳出双重循环', '只跳出内层循环', '跳过内层循环的本次执行', '结束整个程序'], ans: 1, exp: 'break 只能跳出它所在的那一层循环，外层循环继续执行。要一次跳出多层需要用标志变量或 goto。' },
  { id: 'ch6-9', ch: 6, type: 'single', q: '语句 for(;;) printf("*"); 的执行结果是（　）。', opts: ['只输出一个 *', '一个 * 也不输出', '无限输出 *', '语法错误'], ans: 2, exp: 'for 的三个表达式都可以省略，但两个分号不能省。省略表达式2 相当于条件恒真，是死循环。' },
  { id: 'ch6-10', ch: 6, type: 'single', q: '有以下程序段：\nint x=10;\nwhile(x<5)\n{\n    printf("*");\n    x++;\n}\n执行后输出 * 的个数是（　）。', opts: ['0个', '1个', '5个', '无限个'], ans: 0, exp: 'while 先判断：10<5 不成立，循环体一次都不执行，输出 0 个 *。若改成 do-while 则会先执行一次，输出 1 个。' },
  { id: 'ch6-11', ch: 6, type: 'single', q: '有以下程序段：\nint i, j;\nfor(i=0; i<2; i++)\n    for(j=0; j<3; j++)\n        printf("*");\n执行后输出 * 的个数是（　）。', opts: ['2', '3', '5', '6'], ans: 3, exp: '外层执行 2 次，每次外层中内层完整执行 3 次，共 2×3=6 个 *。嵌套循环次数 = 外层次数 × 内层次数。' },
  { id: 'ch6-12', ch: 6, type: 'single', q: '用循环求 n!（阶乘）时，存放阶乘结果的变量 f 应初始化为（　）。', opts: ['0', '1', '-1', 'n'], ans: 1, exp: '累乘的初值必须是 1：f=f*i 中若 f 初值为 0，乘任何数都是 0。记住口诀：累加清零，累乘置 1。' },
  { id: 'ch6-13', ch: 6, type: 'single', q: 'while(i) 等价于（　）。', opts: ['while(i!=0)', 'while(i==0)', 'while(i>0)', 'while(i<0)'], ans: 0, exp: '条件 i 非 0 即真，等价于 while(i!=0)。i 为负数时 while(i) 仍成立，所以 while(i>0) 不等价。' },
  { id: 'ch6-14', ch: 6, type: 'single', q: '下列程序段中，会构成死循环的是（　）。', opts: ['int i=1; while(i<10){ i++; }', 'int i=1; while(i<10) printf("*");', 'int i=1; while(i<10){ printf("*"); i++; }', 'int i; for(i=0; i<3; i++);'], ans: 1, exp: '选项 B 的循环体内没有对 i 更新，i 永远是 1，条件 i<10 永远成立。死循环最常见的原因就是循环变量不更新。' },
  { id: 'ch6-15', ch: 6, type: 'single', q: '关于 break 语句，下列说法正确的是（　）。', opts: ['break 可以用在任意语句中', 'if 语句中可以单独使用 break', 'break 只能用在循环语句和 switch 语句中', 'break 能一次跳出所有循环'], ans: 2, exp: 'break 的适用范围只有两种：循环语句和 switch。它只跳出本层，不能一次跳出所有循环。' },
  { id: 'ch6-16', ch: 6, type: 'single', q: '关于 goto 语句和语句标号，下列说法正确的是（　）。', opts: ['标号必须是一个数字', 'goto 可以跳转到另一个函数中', 'goto 必须与 break 配合使用', 'goto 只能在同一函数内跳转，配合标号可以构成循环'], ans: 3, exp: 'goto 的用法是 goto 标号; 标号用"标识符:"定义，只在同一函数内有效。滥用 goto 破坏结构化，考试只要求了解。' },
  { id: 'ch6-17', ch: 6, type: 'judge', q: 'while 循环的条件一开始就为假时，循环体一次也不执行。', opts: ['正确', '错误'], ans: 0, exp: 'while 先判断后执行，这是它与 do-while（至少执行 1 次）的本质区别。' },
  { id: 'ch6-18', ch: 6, type: 'judge', q: 'continue 语句的作用是终止整个循环的执行。', opts: ['正确', '错误'], ans: 1, exp: 'continue 只结束本次循环、跳到下一次循环的判定；终止整个循环的是 break。' },
  { id: 'ch6-19', ch: 6, type: 'judge', q: 'for 语句的三个表达式都可以省略，但两个分号不能省略。', opts: ['正确', '错误'], ans: 0, exp: 'for(;;) 是合法写法，相当于 while(1) 死循环；分号起分隔作用，必须保留。' },
  { id: 'ch6-20', ch: 6, type: 'judge', q: 'goto 语句可以从一个函数跳转到另一个函数。', opts: ['正确', '错误'], ans: 1, exp: 'goto 和标号只在同一函数内有效，不能跨函数跳转。' },
  { id: 'ch6-21', ch: 6, type: 'blank', q: '程序功能：求 1+2+3+…+100 的值。请补全 for 语句的第三个表达式。\n#include <stdio.h>\nint main()\n{\n    int i, s = 0;\n    for(i=1; i<=100; ____)\n        s = s + i;\n    printf("s=%d", s);\n    return 0;\n}', opts: ['i--', 'i+=2', 'i++', 'i=i+3'], ans: 2, exp: '求和需要 i 从 1 到 100 每次加 1，用 i++。i+=2 会隔一个加一个，i-- 则 i 越来越小永远到不了 100，死循环。' },
  { id: 'ch6-22', ch: 6, type: 'blank', q: '程序功能：输入 n，求 n!。请补全累乘变量的初始化语句。\n#include <stdio.h>\nint main()\n{\n    int i, n;\n    long f;\n    scanf("%d", &n);\n    ____;\n    for(i=1; i<=n; i++)\n        f = f * i;\n    printf("%d!=%ld", n, f);\n    return 0;\n}', opts: ['f=1', 'f=0', 'f=n', 'f=i'], ans: 0, exp: '累乘初值必须是 1：f=0 时任何乘积都是 0；f=n 或 f=i 会随输入变化而出错。' },
  { id: 'ch6-23', ch: 6, type: 'blank', q: '程序功能：输出 1~9 中的奇数。请补全关键字。\n#include <stdio.h>\nint main()\n{\n    int i;\n    for(i=1; i<=9; i++)\n    {\n        if(i%2==0)\n            ____;\n        printf("%d", i);\n    }\n    return 0;\n}', opts: ['break', 'continue', 'exit', 'return'], ans: 1, exp: '遇到偶数用 continue 结束本次循环，跳过 printf 进入下一次循环，所以只输出奇数 13579。若用 break，i=2 时就直接退出整个循环了。' },
  { id: 'ch6-24', ch: 6, type: 'read', q: '写出下面程序的运行结果。\n#include <stdio.h>\nint main()\n{\n    int i;\n    for(i=1; i<=5; i++)\n    {\n        if(i==3) continue;\n        printf("%d", i);\n    }\n    return 0;\n}', opts: ['1245', '12345', '124', '12'], ans: 0, exp: 'i=3 时 continue 跳过 printf，其余的 i 都输出，所以是 1245。若把 continue 换成 break 则只输出 12，注意区分。' },
  { id: 'ch6-25', ch: 6, type: 'read', q: '写出下面程序的运行结果（共输出三行）。\n#include <stdio.h>\nint main()\n{\n    int i, j;\n    for(i=1; i<=3; i++)\n    {\n        for(j=1; j<=i; j++)\n            printf("%d", j);\n        printf("\\n");\n    }\n    return 0;\n}', opts: ['123\n123\n123', '1\n22\n333', '1\n12\n123', '111\n222\n333'], ans: 2, exp: '外层 i=1、2、3，内层 j 从 1 数到 i：第一行输出 1，第二行输出 12，第三行输出 123，每行结束换行。这是数字三角形经典题，内层次数受外层 i 控制。' },
  { id: 'ch6-26', ch: 6, type: 'read', q: '写出下面程序的运行结果。\n#include <stdio.h>\nint main()\n{\n    int x=5;\n    do\n    {\n        printf("%d", x);\n        x--;\n    } while(x>0);\n    return 0;\n}', opts: ['4321', '543210', '5432', '54321'], ans: 3, exp: 'do-while 先执行后判断：依次输出 5、4、3、2、1，x 减到 0 时条件 0>0 不成立退出，输出 54321。' },
  { id: 'ch6-27', ch: 6, type: 'code', q: '编写完整程序：求 1~100 中所有偶数之和，并输出结果。', sample: '#include <stdio.h>\nint main()\n{\n    int i, s = 0;\n    for(i=2; i<=100; i=i+2)\n        s = s + i;\n    printf("s=%d\\n", s);\n    return 0;\n}', exp: '思路：累加和 s 先清零。让 i 从 2 开始每次加 2，只取到偶数（结果 2550）；也可以写成 for(i=1;i<=100;i++) 配合 if(i%2==0) s=s+i; 两种写法都要会。' },
  { id: 'ch6-28', ch: 6, type: 'code', q: '编写完整程序：输入一个正整数 n，求 n!（n 的阶乘，即 1×2×3×…×n），并输出结果。', sample: '#include <stdio.h>\nint main()\n{\n    int i, n;\n    long f = 1;\n    scanf("%d", &n);\n    for(i=1; i<=n; i++)\n        f = f * i;\n    printf("%d!=%ld\\n", n, f);\n    return 0;\n}', exp: '思路：累乘变量 f 必须初始化为 1（为 0 则结果恒为 0），循环 i 从 1 到 n 做 f=f*i。阶乘增长很快，f 用 long 型，输出用 %ld。n=0 时循环一次都不执行，输出 0!=1，也符合阶乘定义。' },
  { id: 'ch6-29', ch: 6, type: 'code', q: '编写完整程序：输出所有的水仙花数。水仙花数是指一个三位数，它等于其各位数字的立方和，例如 153 = 1*1*1 + 5*5*5 + 3*3*3。', sample: '#include <stdio.h>\nint main()\n{\n    int n, a, b, c;\n    for(n=100; n<=999; n++)\n    {\n        a = n / 100;        /* 百位 */\n        b = n / 10 % 10;    /* 十位 */\n        c = n % 10;         /* 个位 */\n        if(a*a*a + b*b*b + c*c*c == n)\n            printf("%d\\n", n);\n    }\n    return 0;\n}', exp: '思路：用 for 把 100~999 的所有三位数逐个检查。关键是分离各位：百位 n/100、十位 n/10%10、个位 n%10。判断立方和等于本身要用 ==（两个等号）。结果共 4 个：153、370、371、407。' }
);

<script>
// 第7章 数组
window.QBANK = window.QBANK || [];
window.NOTES = window.NOTES || {};
window.NOTES[7] = {
  title: '第7章 数组',
  points: '<h3>📌 本章考点清单</h3>' +
    '<ul>' +
    '<li><b>一维数组</b>：定义 <code>int a[10];</code>，下标 0~9；引用 <code>a[10]</code> 是越界（编译不查、运行出错）。</li>' +
    '<li><b>一维初始化</b>：<code>int a[5]={1,2};</code> 其余自动为 0；<code>int a[]={1,2,3};</code> 长度自动为 3；<code>int a[5]={0};</code> 全零惯用写法。</li>' +
    '<li><b>遍历处理</b>：循环累加求和、打擂台求最大值（记下标）、首尾交换逆置。</li>' +
    '<li><b>二维数组</b>：<code>int a[2][3];</code> 按行优先存放；<code>{{1},{4,5}}</code> 缺的补 0；行数可省、列数不能省。</li>' +
    '<li><b>字符数组与字符串</b>：<code>char s[10]="abc";</code> 存 a、b、c、\'\\0\'；\'\\0\' 是结束标志，必须留一个位置。</li>' +
    '<li><b>strlen 与 sizeof</b>：<code>char s[10]="abc";</code> strlen=3、sizeof=10；strlen("abc\\0def")=3。</li>' +
    '<li><b>字符串函数</b>：strlen 求长、strcpy 复制、strcat 连接、strcmp 比较（相等返回 0）。</li>' +
    '<li><b>高频算法</b>：打擂台、冒泡排序、逆置、回文判断、大小写转换（-32 / +32）。</li>' +
    '</ul>' +
    '<h3>📖 核心讲解</h3>' +
    '<h4>1. 一维数组：定义、初始化、下标</h4>' +
    '<p>定义形式：<code>类型名 数组名[长度];</code>。<b>下标从 0 开始，最大下标 = 长度 - 1</b>。定义 int a[5]; 后能用的只有 a[0]~a[4]，写 a[5] 就是越界。</p>' +
    '<pre>int a[5] = {1, 2};      /* 得到 1 2 0 0 0，其余自动补 0 */\nint b[]  = {1, 2, 3};   /* 长度自动确定为 3 */\nint c[100] = {0};       /* 100 个元素全为 0 的惯用写法 */\nfor(i=0; i&lt;5; i++)      /* 遍历模板 */\n    printf("%d ", a[i]);</pre>' +
    '<h4>2. 打擂台求最大值（记下标）与逆置</h4>' +
    '<pre>/* 打擂台：k 记录最大值的下标 */\nint a[6] = {3,7,2,9,5,1}, i, k = 0;\nfor(i=1; i&lt;6; i++)\n    if(a[i] &gt; a[k]) k = i;      /* 最大值就是 a[k] */\n\n/* 逆置：首尾交换，只循环一半 */\nfor(i=0; i&lt;5/2; i++)\n{\n    t = a[i]; a[i] = a[4-i]; a[4-i] = t;\n}</pre>' +
    '<h4>3. 二维数组</h4>' +
    '<p><code>int a[2][3];</code> 是 2 行 3 列共 6 个元素，内存中<b>按行优先</b>连续存放：a[0][0], a[0][1], a[0][2], a[1][0], a[1][1], a[1][2]。</p>' +
    '<pre>int a[2][3] = {{1},{4,5}};\n/* 第一行: 1 0 0 ；第二行: 4 5 0 （缺的自动补 0） */\n\nint b[][3] = {1,2,3,4,5,6};   /* 对：行数可省，自动分 2 行 */\nint c[2][];                   /* 错：列数不能省！ */\n\nfor(i=0; i&lt;2; i++)            /* 双重循环：外层行、内层列 */\n    for(j=0; j&lt;3; j++)\n        s = s + a[i][j];</pre>' +
    '<h4>4. 字符数组与结束标志 \'\\0\'</h4>' +
    '<p><code>char s[10]="abc";</code> 里依次存放 a、b、c、\'\\0\'。存 n 个字符的字符串，数组长度至少要 n+1，<b>多出来的那个位置就是给结束标志留的</b>——没有 \'\\0\'，printf、strlen 等函数就不知道字符串到哪里结束。</p>' +
    '<pre>char s[10] = "abc";\nstrlen(s)           /* 3  ：数到 \'\\0\' 为止，不含 \'\\0\' */\nsizeof(s)           /* 10 ：数组总共占的字节数 */\nstrlen("abc\\0def")  /* 3  ：遇到第一个 \'\\0\' 就停 */\n\n/* 逐个处理字符串的标准循环（必背） */\nfor(i=0; s[i]!=\'\\0\'; i++)\n    { /* 对 s[i] 做处理 */ }</pre>' +
    '<h4>5. 字符数组的三种输入方式</h4>' +
    '<table><tr><th>方式</th><th>写法</th><th>特点</th></tr>' +
    '<tr><td>scanf %s</td><td><code>scanf("%s", s);</code></td><td>遇空格/回车/Tab 结束；s 前<b>不加</b> &amp;</td></tr>' +
    '<tr><td>gets</td><td><code>gets(s);</code></td><td>读一整行，可以带空格，回车结束</td></tr>' +
    '<tr><td>逐个字符</td><td><code>while((s[i]=getchar())!=\'\\n\') i++;</code></td><td>最灵活，适合按字符处理</td></tr></table>' +
    '<p>注意：<code>char s[10]; s="abc";</code> 是非法的——数组名是地址常量，不能整体赋值。定义时可以 <code>char s[10]="abc";</code>，之后想重新赋值只能 <code>strcpy(s,"abc");</code>。</p>' +
    '<h4>6. 常用字符串函数速查（#include &lt;string.h&gt;）</h4>' +
    '<table><tr><th>函数</th><th>功能</th><th>备注</th></tr>' +
    '<tr><td>strlen(s)</td><td>求串长（不含 \'\\0\'）</td><td>结果可以赋给 int 变量</td></tr>' +
    '<tr><td>strcpy(s1,s2)</td><td>把 s2 复制到 s1</td><td>不能写 s1=s2</td></tr>' +
    '<tr><td>strcat(s1,s2)</td><td>把 s2 接到 s1 后面</td><td>s1 要足够长</td></tr>' +
    '<tr><td>strcmp(s1,s2)</td><td>逐字符比较两串</td><td><b>相等返回 0</b>，s1 大返回正数、s1 小返回负数</td></tr></table>' +
    '<p>大小写转换：小写→大写 <code>s[i]=s[i]-32;</code>，大写→小写 <code>s[i]=s[i]+32;</code>（也可用 toupper / tolower）。</p>' +
    '<h4>7. 经典模板：冒泡排序与回文</h4>' +
    '<pre>/* 冒泡排序（10 个数升序）——必背 */\nfor(i=0; i&lt;9; i++)              /* 9 趟 */\n    for(j=0; j&lt;9-i; j++)        /* 每趟比较 9-i 次 */\n        if(a[j] &gt; a[j+1])\n        {\n            t = a[j]; a[j] = a[j+1]; a[j+1] = t;\n        }\n\n/* 回文判断：i 从头、j 从尾向中间靠 */\nj = strlen(s) - 1;\nfor(i=0; i&lt;j; i++, j--)\n    if(s[i] != s[j]) { flag = 0; break; }</pre>' +
    '<h3>⚠️ 易错陷阱清单</h3>' +
    '<ul>' +
    '<li><b>下标越界 a[5]</b>：int a[5]; 只有 a[0]~a[4]；C 编译不查越界，运行可能出错。</li>' +
    '<li><b>s = "abc";</b>：数组名不能整体赋值，必须 strcpy(s,"abc"); 或定义时初始化。</li>' +
    '<li><b>scanf("%s",&amp;s)</b>：s 本身就是地址，前面<b>不加</b> &amp;。</li>' +
    '<li><b>strlen / sizeof 混淆</b>：char s[10]="abc"; strlen 是 3（内容长度），sizeof 是 10（数组大小）。</li>' +
    '<li><b>忘给 \'\\0\' 留位置</b>：存 10 个字符要开长度 11 的数组。</li>' +
    '<li><b>strcmp 结果</b>：相等返回 0 而不是 1；返回值的正负代表两串的大小关系。</li>' +
    '<li><b>二维数组省列数</b>：int a[2][]; 错；行数可省、列数必写。</li>' +
    '<li><b>初值个数超长度</b>：int a[3]={1,2,3,4}; 编译出错。</li>' +
    '</ul>'
};
window.QBANK.push(
  { id: 'ch7-1', ch: 7, type: 'single', q: '已定义 int a[10]; 则数组元素下标的合法范围是（　）。', opts: ['1~10', '0~9', '0~10', '1~9'], ans: 1, exp: '数组下标从 0 开始，int a[10]; 的合法下标是 0~9。a[10] 越界，是最常见的错误。' },
  { id: 'ch7-2', ch: 7, type: 'single', q: '已定义 int a[5]; 下列对数组元素的引用中错误的是（　）。', opts: ['a[0]', 'a[5-1]', 'a[5]', 'a[2+2]'], ans: 2, exp: '合法下标是 0~4，a[5] 越界。C 编译系统不检查下标越界，运行时可能得到错误结果甚至破坏数据。' },
  { id: 'ch7-3', ch: 7, type: 'single', q: '已定义 int a[5]={1,2}; 则 a[3] 的值是（　）。', opts: ['0', '2', '1', '编译出错'], ans: 0, exp: '初始化时只给前两个元素赋值，其余元素自动为 0，所以 a[3] 是 0。注意不是"不确定"。' },
  { id: 'ch7-4', ch: 7, type: 'single', q: '已定义 int a[]={1,2,3,4,5}; 则数组 a 的长度是（　）。', opts: ['4', '3', '不确定', '5'], ans: 3, exp: '定义并初始化时省略长度，编译器按初值个数自动确定长度为 5。' },
  { id: 'ch7-5', ch: 7, type: 'single', q: '要把整型数组 a 的 5 个元素全部初始化为 0，正确的写法是（　）。', opts: ['int a[5]=0;', 'int a[5]={1};', 'int a[5]={0};', 'int a[5]=0,0,0,0,0;'], ans: 2, exp: 'int a[5]={0}; 使第一个元素为 0，其余自动补 0，是全零的惯用写法。A、D 不符合语法，B 只把 a[0] 初始化为 1。' },
  { id: 'ch7-6', ch: 7, type: 'single', q: '下列二维数组的定义中正确的是（　）。', opts: ['int a[2,3];', 'int a[2][3];', 'int a[2][];', 'int a[][];'], ans: 1, exp: '二维数组定义必须写两个方括号，且列数不能省略，正确形式如 int a[2][3];。' },
  { id: 'ch7-7', ch: 7, type: 'single', q: '已定义 int a[2][3]={{1},{4,5}}; 则 a[1][2] 的值是（　）。', opts: ['5', '1', '0', '4'], ans: 2, exp: '按行分组初始化：第一行是 1 0 0，第二行是 4 5 0，缺失的元素自动补 0，故 a[1][2]=0。' },
  { id: 'ch7-8', ch: 7, type: 'single', q: '下列对二维数组的初始化中，合法的是（　）。', opts: ['int a[2][]={{1,2,3},{4,5,6}};', 'int a[][]={{1,2},{3,4}};', 'int a[][3]={1,2,3,4,5,6};', 'int a[2][3]={{1,2},{3,4,5,6}};'], ans: 2, exp: '初始化时行数可以省略（自动分组），列数绝不能省。D 选项第二行给了 4 个数，超过列数 3，编译出错。' },
  { id: 'ch7-9', ch: 7, type: 'single', q: '二维数组在内存中的存放顺序是（　）。', opts: ['按列优先存放', '随机存放', '按行优先存放', '按元素大小存放'], ans: 2, exp: '二维数组按行优先存放：先存第 0 行的全部元素，再存第 1 行，依此类推。' },
  { id: 'ch7-10', ch: 7, type: 'single', q: '已定义 char s[10]="abc"; 则 s[3] 中存放的是（　）。', opts: ['空格字符', "'c'", "'\\0'", '不确定的值'], ans: 2, exp: '字符串常量"abc"末尾自动加结束标志\'\\0\'，所以 s[3] 存放的是\'\\0\'。' },
  { id: 'ch7-11', ch: 7, type: 'single', q: '已定义 char s[10]="abc"; 则 strlen(s) 和 sizeof(s) 的值分别是（　）。', opts: ['10 和 3', '3 和 3', '10 和 10', '3 和 10'], ans: 3, exp: 'strlen 统计\'\\0\'之前的字符个数，结果 3；sizeof 求数组占的总字节数，结果 10。两者极易混淆。' },
  { id: 'ch7-12', ch: 7, type: 'single', q: '表达式 strlen("abc\\0def") 的值是（　）。', opts: ['3', '7', '6', '4'], ans: 0, exp: 'strlen 遇到第一个\'\\0\'就停止统计，"abc\\0def" 的有效字符只有 abc，故结果为 3 而不是 7。' },
  { id: 'ch7-13', ch: 7, type: 'single', q: '已定义 char s[10]; 要把字符串"abc"存入 s，下列语句正确的是（　）。', opts: ['s="abc";', 's[10]="abc";', 'strcpy(s,"abc");', 'scanf("%s",&s);'], ans: 2, exp: '数组名是地址常量，不能整体赋值，必须用 strcpy 复制。scanf 的 s 前也不能加 &，s 本身就是地址。' },
  { id: 'ch7-14', ch: 7, type: 'single', q: '执行 scanf("%s", s); 时从键盘输入 how are you，则字符数组 s 中得到的是（　）。', opts: ['how are you', 'are you', 'howareyou', 'how'], ans: 3, exp: 'scanf 用 %s 输入字符串时遇空格、回车或 Tab 即结束，所以 s 只得到 how。要读入带空格的整行应使用 gets。' },
  { id: 'ch7-15', ch: 7, type: 'single', q: '要从键盘输入一行可能含空格的字符串存入字符数组 s，应使用的语句是（　）。', opts: ['gets(s);', 'scanf("%s",s);', 'scanf("%c",s);', 'puts(s);'], ans: 0, exp: 'gets 能读入包括空格在内的整行字符，遇回车结束；scanf("%s",s) 遇空格就停；puts 是输出函数。' },
  { id: 'ch7-16', ch: 7, type: 'single', q: '若字符串 s1 与 s2 内容完全相同，则 strcmp(s1,s2) 的返回值是（　）。', opts: ['1', '-1', '0', '两串长度之差'], ans: 2, exp: 'strcmp 按字典序逐个字符比较：相等返回 0，s1 大返回正数，s1 小返回负数。' },
  { id: 'ch7-17', ch: 7, type: 'single', q: '函数 strcat(s1,s2) 的功能是（　）。', opts: ['把 s2 连接到 s1 的后面', '比较 s1 和 s2 的大小', '把 s1 复制到 s2 中', '交换 s1 和 s2 的内容'], ans: 0, exp: 'strcat(s1,s2) 把 s2 接到 s1 的末尾，结果存放在 s1 中，要求 s1 足够长。' },
  { id: 'ch7-18', ch: 7, type: 'single', q: '字符数组 s 中存放的是小写字母，要把 s[i] 转换成对应的大写字母，正确的写法是（　）。', opts: ['s[i]=s[i]+32;', 's[i]=s[i]-32;', "s[i]=s[i]-'0';", 's[i]=s[i]*2;'], ans: 1, exp: '小写字母的 ASCII 码比对应大写字母大 32，减 32 即转大写；加 32 是大写转小写。' },
  { id: 'ch7-19', ch: 7, type: 'single', q: '有以下程序段：\nint a[6]={3,7,2,9,5,1}, i, k=0;\nfor(i=1; i<6; i++)\n    if(a[i]>a[k]) k=i;\nprintf("%d,%d\\n", a[k], k);\n执行后输出结果是（　）。', opts: ['3,9', '9,9', '1,5', '9,3'], ans: 3, exp: '打擂台法中 k 记录最大值的下标：最大值 9 在 a[3]，故输出 9,3。注意 printf 里先输出 a[k]（最大值），再输出 k（下标）。' },
  { id: 'ch7-20', ch: 7, type: 'judge', q: 'C 语言对数组下标越界不作检查，如 int a[5]; 后引用 a[5]，编译时不一定报错，但运行时可能出错。', opts: ['正确', '错误'], ans: 0, exp: 'C 编译系统不检查下标越界，越界引用编译能通过，但可能破坏内存中的数据，是隐蔽的错误。' },
  { id: 'ch7-21', ch: 7, type: 'judge', q: '已定义 char s[10]; 执行 s="abc"; 就能把字符串"abc"存入数组 s。', opts: ['正确', '错误'], ans: 1, exp: '数组名是地址常量，不能被赋值。只能定义时初始化，或用 strcpy 复制，或逐个元素赋值。' },
  { id: 'ch7-22', ch: 7, type: 'judge', q: '二维数组 int a[2][3] 的 6 个元素在内存中按行优先的顺序连续存放。', opts: ['正确', '错误'], ans: 0, exp: '先存 a[0][0]、a[0][1]、a[0][2]，再存 a[1][0]、a[1][1]、a[1][2]，内存中是连续的。' },
  { id: 'ch7-23', ch: 7, type: 'judge', q: '字符串"abc"在内存中占用 3 个字节。', opts: ['正确', '错误'], ans: 1, exp: '字符串末尾有结束标志\'\\0\'，"abc"实际占 4 个字节。strlen("abc") 是 3，占用字节数是 4，两者不一样。' },
  { id: 'ch7-24', ch: 7, type: 'blank', q: '程序功能：用"打擂台"法求数组中的最大值。请补全 if 语句的条件。\n#include <stdio.h>\nint main()\n{\n    int a[6]={8,3,9,1,6,4}, i, max;\n    max = a[0];\n    for(i=1; i<6; i++)\n        if(____)\n            max = a[i];\n    printf("max=%d\\n", max);\n    return 0;\n}', opts: ['a[i]>max', 'a[i]<max', 'max>a[i]', 'a[i]>a[0]'], ans: 0, exp: '打擂台法：max 先当擂主，后面的元素比 max 大就替换它，条件是 a[i]>max。B、C 方向反了，D 是每次都跟第一个元素比。' },
  { id: 'ch7-25', ch: 7, type: 'blank', q: '程序功能：把数组 a 中的 5 个元素逆置（首尾交换）。请补全交换语句。\n#include <stdio.h>\nint main()\n{\n    int a[5]={1,2,3,4,5}, i, t;\n    for(i=0; i<2; i++)\n    {\n        t = a[i];\n        ____;\n        a[4-i] = t;\n    }\n    for(i=0; i<5; i++)\n        printf("%d ", a[i]);\n    return 0;\n}', opts: ['a[4-i]=a[i];', 'a[i]=a[4-i];', 'a[i]=t;', 'a[i+1]=a[i];'], ans: 1, exp: '三步交换：t 暂存 a[i]，把 a[4-i] 交给 a[i]，最后把 t 交给 a[4-i]，故填 a[i]=a[4-i];。程序运行后输出 5 4 3 2 1。' },
  { id: 'ch7-26', ch: 7, type: 'read', q: '写出下面程序的运行结果。\n#include <stdio.h>\nint main()\n{\n    int a[6]={1,2,3,4,5,6}, i, s=0;\n    for(i=1; i<6; i+=2)\n        s = s + a[i];\n    printf("%d\\n", s);\n    return 0;\n}', opts: ['21', '12', '9', '6'], ans: 1, exp: '循环取下标 1、3、5 的元素：a[1]+a[3]+a[5]=2+4+6=12。注意 i 从 1 开始、每次加 2；21 是全部元素之和，9 是偶数下标元素之和。' },
  { id: 'ch7-27', ch: 7, type: 'read', q: '写出下面程序的运行结果。\n#include <stdio.h>\nint main()\n{\n    char s[]="level2026";\n    int i, n=0;\n    for(i=0; s[i]!=\'\\0\'; i++)\n        if(s[i]>=\'0\' && s[i]<=\'9\')\n            n++;\n    printf("%d\\n", n);\n    return 0;\n}', opts: ['2', '4', '5', '9'], ans: 1, exp: '逐个字符判断是否数字字符：2、0、2、6 共 4 个，输出 4。5 是字母个数，9 是总长度。注意 s[i] 是字符，要与\'0\'和\'9\'比较而不是与 0 和 9 比较。' },
  { id: 'ch7-28', ch: 7, type: 'code', q: '编写完整程序：从键盘输入 10 个整数存入数组，求其中的最大值、最小值和平均值并输出。', sample: '#include <stdio.h>\nint main()\n{\n    int a[10], i, max, min, sum = 0;\n    double avg;\n    for(i=0; i<10; i++)\n        scanf("%d", &a[i]);\n    max = min = a[0];\n    for(i=1; i<10; i++)\n    {\n        if(a[i] > max) max = a[i];    /* 打擂台：更大的换上 */\n        if(a[i] < min) min = a[i];    /* 更小的换上 */\n        sum = sum + a[i];\n    }\n    avg = (double)sum / 10;\n    printf("max=%d\\n", max);\n    printf("min=%d\\n", min);\n    printf("avg=%f\\n", avg);\n    return 0;\n}', exp: '思路：max、min 都初始化为 a[0]，从 a[1] 开始逐个比较更新（打擂台法）；累加求和顺便进行。平均值用 (double)sum/10 计算，避免整数除法丢掉小数部分。' },
  { id: 'ch7-29', ch: 7, type: 'code', q: '编写完整程序：从键盘输入 10 个整数，用冒泡排序法将它们按从小到大的顺序排序后输出。', sample: '#include <stdio.h>\nint main()\n{\n    int a[10], i, j, t;\n    for(i=0; i<10; i++)\n        scanf("%d", &a[i]);\n    for(i=0; i<9; i++)              /* 共进行 9 趟 */\n        for(j=0; j<9-i; j++)        /* 每趟比较 9-i 次 */\n            if(a[j] > a[j+1])       /* 前面的大就交换 */\n            {\n                t = a[j];\n                a[j] = a[j+1];\n                a[j+1] = t;\n            }\n    for(i=0; i<10; i++)\n        printf("%d ", a[i]);\n    printf("\\n");\n    return 0;\n}', exp: '思路：外层控制趟数（n-1 趟），内层控制每趟比较次数（n-1-i 次），相邻两数比较，大的往后沉。核心是三变量交换，双重循环的边界要背熟。' },
  { id: 'ch7-30', ch: 7, type: 'code', q: '编写完整程序：输入一个字符串，判断它是否为回文（正读反读都相同，如 level），是则输出 yes，否则输出 no。', sample: '#include <stdio.h>\n#include <string.h>\nint main()\n{\n    char s[80];\n    int i, j, flag = 1;\n    gets(s);\n    j = strlen(s) - 1;          /* j 指向最后一个字符 */\n    for(i=0; i<j; i++, j--)\n        if(s[i] != s[j])        /* 首尾不对称就不是回文 */\n        {\n            flag = 0;\n            break;\n        }\n    if(flag == 1)\n        printf("yes\\n");\n    else\n        printf("no\\n");\n    return 0;\n}', exp: '思路：i 从头、j 从尾向中间走，j 的初值是 strlen(s)-1，只要出现 s[i]!=s[j] 就置 flag=0 并跳出循环。也可以不用 break，循环结束后统一判断 flag。' }
);

<script>
// 第8章 函数
window.QBANK = window.QBANK || [];
window.NOTES = window.NOTES || {};
window.NOTES[8] = {
  title: '第8章 函数',
  points: '<h3>📌 本章考点清单</h3>' +
    '<ul>' +
    '<li><b>函数定义</b>：<code>类型名 函数名(形参列表) { ... }</code>；每个形参都要单独写类型：<code>int max(int a,int b)</code> 对，<code>int max(a,b)</code> 错。</li>' +
    '<li><b>返回值</b>：无返回值用 void；return 只能带回一个值；执行 return 后函数立即结束。</li>' +
    '<li><b>声明与定义</b>：定义在使用之后必须先声明；声明末尾有分号、定义头部没有。</li>' +
    '<li><b>值传递</b>：形参是实参的副本，改变形参不影响实参（经典 swap 题）。</li>' +
    '<li><b>数组作参数</b>：传首地址，形参改变实参跟着变；元素个数另传：<code>int f(int a[],int n)</code>。</li>' +
    '<li><b>嵌套与递归</b>：不能嵌套定义、可以嵌套调用；递归 = 递推公式 + 终止条件。</li>' +
    '<li><b>变量作用域</b>：局部 / 全局；同名局部优先；static 局部变量只初始化一次、跨调用保留。</li>' +
    '</ul>' +
    '<h3>📖 核心讲解</h3>' +
    '<h4>1. 定义 vs 声明（常考对比）</h4>' +
    '<table><tr><th></th><th>声明（原型）</th><th>定义</th></tr>' +
    '<tr><td>写法</td><td><code>int max(int a,int b);</code></td><td><code>int max(int a,int b) { ... }</code></td></tr>' +
    '<tr><td>末尾分号</td><td><b>必须有</b></td><td><b>不能有</b></td></tr>' +
    '<tr><td>作用</td><td>告诉编译器"后面有这么个函数"</td><td>写出函数的真正代码</td></tr></table>' +
    '<p>规则：<b>被调函数定义在主调函数后面时，必须先声明再调用</b>；定义在前面则可以不声明。</p>' +
    '<h4>2. 形参、实参与值传递</h4>' +
    '<ul>' +
    '<li>实参与形参按位置对应：个数相同、类型一致；实参可以是常量、变量或表达式。</li>' +
    '<li>形参在调用前不占内存，调用时才分配，函数结束立即释放。</li>' +
    '</ul>' +
    '<pre>void swap(int x, int y)      /* x、y 只是 a、b 的副本 */\n{\n    int t; t = x; x = y; y = t;\n}\nint main()\n{\n    int a = 3, b = 5;\n    swap(a, b);\n    printf("%d,%d", a, b);   /* 输出 3,5 —— 交换失败！ */\n    return 0;\n}</pre>' +
    '<p>想真正交换必须传地址（指针一章的内容）；<b>数组是例外</b>——数组名本身就是地址，所以形参数组变了实参也变：</p>' +
    '<pre>int sum(int a[], int n)      /* 长度不写，用 n 传元素个数 */\n{\n    int i, s = 0;\n    for(i=0; i&lt;n; i++) s = s + a[i];\n    return s;\n}</pre>' +
    '<h4>3. 递归：两要素 + 展开过程（以 4! 为例）</h4>' +
    '<pre>long fact(int n)\n{\n    if(n &lt;= 1) return 1;        /* ① 终止条件 */\n    return n * fact(n - 1);     /* ② 递推公式 */\n}</pre>' +
    '<pre>fact(4) = 4 * fact(3)\n        = 4 * (3 * fact(2))\n        = 4 * (3 * (2 * fact(1)))\n        = 4 * (3 * (2 * 1)) = 24</pre>' +
    '<p>先一层层"递"下去直到终止条件，再一层层"归"回来算出结果。没有终止条件就会无限递归、程序崩溃。</p>' +
    '<h4>4. 变量作用域与生命周期</h4>' +
    '<table><tr><th>变量</th><th>作用域</th><th>生命周期 / 特点</th></tr>' +
    '<tr><td>局部 auto 变量</td><td>所在函数内部</td><td>每次调用重新分配、重新初始化，结束即丢</td></tr>' +
    '<tr><td>局部 static 变量</td><td>所在函数内部</td><td><b>只初始化一次</b>，值保留到下一次调用</td></tr>' +
    '<tr><td>全局变量</td><td>定义处 → 源文件结束</td><td>全程存在；与局部同名时<b>局部优先</b></td></tr></table>' +
    '<pre>void f()\n{\n    static int c = 0;    /* 只在第一次调用时执行这一句 */\n    c++;\n    printf("%d ", c);\n}\n/* 连续调用 3 次输出：1 2 3 */\n/* 去掉 static 则每次都输出：1 1 1 */</pre>' +
    '<h3>⚠️ 易错陷阱清单</h3>' +
    '<ul>' +
    '<li><b>形参漏写类型</b>：int max(a,b) 错；每个形参都要写类型 int max(int a,int b)。</li>' +
    '<li><b>声明忘分号 / 定义多分号</b>：int max(int a,int b); 是声明；定义头后面接函数体时不能带分号。</li>' +
    '<li><b>以为 swap 能交换</b>：值传递改的是副本，实参不变；数组传地址才有效。</li>' +
    '<li><b>递归无终止条件</b>：必须有出口，否则无限递归、程序崩溃。</li>' +
    '<li><b>static 想当然</b>：static int c=0; 只执行一次，别以为每次调用都置 0。</li>' +
    '<li><b>全局变量位置</b>：从定义处才生效，定义在文件末尾时前面的函数用不到。</li>' +
    '<li><b>return 只能带回一个值</b>：想"带回"多个结果要用数组参数（地址传递）。</li>' +

  { id: 'ch8-20', ch: 8, type: 'judge', q: '全局变量与函数内的局部变量同名时，在该函数内起作用的是全局变量。', opts: ['正确', '错误'], ans: 1, exp: '同名时局部优先，全局变量被屏蔽。' },
  { id: 'ch8-21', ch: 8, type: 'blank', q: '程序功能：输入两个整数，输出其中较大的一个。请补全对 max 函数的调用。\n#include <stdio.h>\nint max(int x, int y);      /* 函数声明 */\nint main()\n{\n    int a, b, m;\n    scanf("%d%d", &a, &b);\n    m = ____;\n    printf("max=%d\\n", m);\n    return 0;\n}\nint max(int x, int y)\n{\n    return x>y ? x : y;\n}', opts: ['max(a,b)', 'max(int a,int b)', 'max(&a,&b)', 'max(a;b)'], ans: 0, exp: '调用时实参只写变量名或表达式，不带类型、用逗号分隔。max(&a,&b) 传的是地址，与 int 形参不匹配。' },

  { id: 'ch8-23', ch: 8, type: 'read', q: '写出下面程序的运行结果。\n#include <stdio.h>\nlong f(int n)\n{\n    if(n<=1)\n        return 1;\n    return n * f(n-1);\n}\nint main()\n{\n    printf("%ld\\n", f(5));\n    return 0;\n}', opts: ['24', '120', '5', '1'], ans: 1, exp: '递归求 5!：f(5)=5×f(4)=5×4×3×2×1=120。递归出口是 n<=1 时返回 1。24 是 4!，别漏乘 5。' },

  { id: 'ch8-25', ch: 8, type: 'code', q: '编写完整程序：编写函数 int isprime(int n) 判断 n 是否为素数（是则返回 1，不是返回 0），在 main 函数中输入一个整数并调用该函数，是素数输出 yes，否则输出 no。', sample: '#include <stdio.h>\nint isprime(int n)\n{\n    int i;\n    if(n < 2)\n        return 0;               /* 0、1、负数不是素数 */\n    for(i=2; i<=n-1; i++)\n        if(n % i == 0)          /* 能被整除，不是素数 */\n            return 0;\n    return 1;\n}\nint main()\n{\n    int n;\n    scanf("%d", &n);\n    if(isprime(n) == 1)\n        printf("yes\\n");\n    else\n        printf("no\\n");\n    return 0;\n}', exp: '思路：素数是只能被 1 和自身整除的数。用 2~n-1 逐个试除，遇到能整除的立即 return 0；全都除不尽返回 1。注意 n<2 要单独排除。试除上界也可写成 i<=n/2 或 i<=sqrt(n)。' },
